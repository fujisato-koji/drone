<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>海と風のシミュレータ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#cfe3f2 0%, #eef5fa 55%, #f7f4ea 100%);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #c { position: fixed; inset: 0; display: block; }
  #panel { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; box-sizing: border-box;
           padding: 10px; overflow-y: auto; background: rgba(20, 24, 30, 0.80); color: #e8ecef;
           font-size: 12px; line-height: 1.4; }
  #panel h1 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  #panel h3 { font-size: 12px; margin: 10px 0 3px; font-weight: 600; color: #e8ecef; }
  #panel .dim { color: #aab3bb; }
  #panel .warn { color: #ffcf6b; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 0 0 1px; }
  #panel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .ctl label { width: 112px; flex: none; }
  .ctl label.auto { width: auto; }
  .ctl.step label { width: 100px; }
  .ctl select { flex: 1; min-width: 0; }
  #panel .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  #panel .top button { flex: none; }
  #panel details.sec { margin: 12px 0 0; }
  #panel summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 0 3px; margin: 0 0 5px;
                   border-bottom: 1px solid rgba(255, 255, 255, 0.22); }
  #panel .sub { margin: 8px 0 2px; font-weight: 600; }
  #panel .hint { margin: -1px 0 3px 0; }
  .ctl input[type=range] { flex: 1; min-width: 0; }
  .ctl .val { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .card { background: #fcfcfb; color: #52514e; border-radius: 4px; padding: 4px 0 0; margin: 0 0 8px; width: 280px; }
  .card .ct { color: #0b0b0b; font-size: 12px; font-weight: 600; padding: 0 6px 2px; }
  .card canvas { display: block; width: 280px; height: 170px; }
  .card canvas#strip { height: 96px; }
  .ctl input[type=number] { width: 64px; }
  .ctl input[type=checkbox] { margin: 0 4px 0 0; }
  #tip { position: fixed; pointer-events: none; display: none; background: #0b0b0b; color: #f0efec;
         font-size: 11px; padding: 2px 6px; border-radius: 3px; z-index: 10; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="top"><h1 data-i="title"></h1><button id="lang" type="button" data-t="langTip"></button></div>
  <div class="dim" id="what" data-i="what"></div>
  <div class="dim" id="meta"></div>
  <div class="warn" id="warn"></div>

  <details class="sec" open>
    <summary id="sec1s" data-i="sec1"></summary>
    <div class="ctl"><label for="envMode" data-i="envMode" data-t="envModeTip"></label><select id="envMode" data-t="envModeTip"><option value="scenario" data-i="emScen"></option><option value="free" data-i="emFree"></option><option value="varying" data-i="emVar"></option></select></div>
    <div id="scen" style="display:none">
      <div class="ctl"><label for="hour" data-i="hour" data-t="hourTip"></label><input id="hour" type="range" min="0" max="72" step="0.1" value="0" data-t="hourTip"><span class="val" id="hourv"></span></div>
      <div class="ctl"><button id="play" type="button" data-t="playTip"></button>
        <label for="rate" style="width:auto" data-i="rate" data-t="rateTip"></label>
        <select id="rate" data-t="rateTip"><option value="1">1 h/s</option><option value="3" selected>3 h/s</option><option value="6">6 h/s</option></select></div>
      <table id="sro"></table>
    </div>
    <div id="windCtl">
      <div class="ctl"><label for="u10" data-i="u10" data-t="u10Tip"></label><input id="u10" type="range" min="2" max="25" step="0.5" data-t="u10Tip"><span class="val" id="u10v"></span></div>
      <div class="ctl"><label for="from" data-i="from" data-t="fromTip"></label><input id="from" type="range" min="0" max="359" step="1" data-t="fromTip"><span class="val" id="fromv"></span></div>
    </div>
    <div id="freeCtl" style="display:none">
      <div class="ctl"><label for="age" data-i="age" data-t="ageTip"></label><input id="age" type="range" min="0" max="5" step="1" value="0" data-t="ageTip"><span class="val" id="agev"></span></div>
      <div class="ctl"><label class="auto" data-t="swOnTip"><input id="swOn" type="checkbox" data-t="swOnTip"><span data-i="swOn"></span></label></div>
      <div class="ctl"><label for="swHs" data-i="swHs" data-t="swHsTip"></label><input id="swHs" type="range" min="0.2" max="4" step="0.1" value="1" data-t="swHsTip"><span class="val" id="swHsv"></span></div>
      <div class="ctl"><label for="swTp" data-i="swTp" data-t="swTpTip"></label><input id="swTp" type="range" min="6" max="18" step="0.5" value="11" data-t="swTpTip"><span class="val" id="swTpv"></span></div>
      <div class="ctl"><label for="swFrom" data-i="swFrom" data-t="swFromTip"></label><input id="swFrom" type="range" min="0" max="359" step="1" value="200" data-t="swFromTip"><span class="val" id="swFromv"></span></div>
      <table id="envro"></table>
    </div>
    <div id="varCtl" style="display:none">
      <div class="ctl"><label for="slowKind" data-i="slowKind" data-t="slowKindTip"></label><select id="slowKind" data-t="slowKindTip"><option value="calm" data-i="skCalm"></option><option value="cell" data-i="skCell"></option></select></div>
      <div class="ctl"><label for="envSeed" data-i="envSeed" data-t="envSeedTip"></label><input id="envSeed" type="number" min="1" max="999999" step="1" value="1" data-t="envSeedTip"></div>
      <div class="card"><div class="ct" data-i="stripT" data-t="stripTip"></div><canvas id="strip" width="280" height="96" data-t="stripTip"></canvas></div>
    </div>
    <div class="dim" id="timeNote" data-i="timeNote"></div>
    <div class="dim" id="rough"></div>
    <div class="dim" id="lockNote" style="display:none"></div>
  </details>

  <details class="sec" open>
    <summary data-i="sec2" data-t="sec2Tip"></summary>
    <div id="fl">
      <div class="ctl step"><label for="flAc" data-i="stAc" data-t="flAcTip"></label><select id="flAc" data-t="flAcTip"></select></div>
      <div class="ctl step"><label for="flPos" data-i="stPos" data-t="flPosTip"></label><select id="flPos" data-t="flPosTip"><option value="mast" data-i="posMast"></option><option value="click" data-i="posClick"></option></select></div>
      <div class="dim hint" id="flPt"></div>
      <div class="ctl step"><label for="flHead" data-i="stHead" data-t="flHeadTip"></label><select id="flHead" data-t="flHeadTip"><option value="up" data-i="hUp"></option><option value="down" data-i="hDown"></option><option value="left" data-i="hLeft"></option><option value="right" data-i="hRight"></option><option value="ref" data-i="hRef"></option></select></div>
      <div class="ctl step"><label for="flTgt" data-i="stTgt" data-t="flTgtTip"></label><select id="flTgt" data-t="flTgtTip"><option value="none" data-i="tgtNone"></option><option value="click" data-i="tgtClick"></option></select></div>
      <div id="tgtCtl" style="display:none">
        <div class="ctl"><button id="flPlace" type="button" data-t="placeTip"></button></div>
        <div class="dim hint" id="tgtPt"></div>
        <div class="ctl"><label for="tgtDist" data-i="tgtDist" data-t="tgtDistTip"></label><input id="tgtDist" type="number" min="100" max="20000" step="100" value="1000" style="width:64px" data-t="tgtDistTip"><select id="tgtDir" data-t="tgtDistTip"><option value="up" data-i="tdUp"></option><option value="down" data-i="tdDown"></option><option value="across" data-i="tdAcross"></option></select><button id="tgtSet" type="button" data-i="tgtSet" data-t="tgtDistTip"></button></div>
        <div class="card"><div class="ct" data-i="hullT" data-t="hullTip"></div><canvas id="hullCv" width="280" height="200" data-t="hullTip"></canvas></div>
      </div>
      <div class="ctl step"><label for="flWorld" data-i="stWorld" data-t="flWorldTip"></label><select id="flWorld" data-t="flWorldTip"><option value="flat" data-i="worldFlat"></option><option value="truth" data-i="worldTruth"></option></select></div>
      <div class="ctl step"><label for="flMotor" data-i="stMotor" data-t="flMotorTip"></label><select id="flMotor" data-t="flMotorTip"><option value="off" data-i="motorOff"></option><option value="on" data-i="motorOn"></option></select></div>
      <div class="ctl step"><label for="flPw" data-i="stPw" data-t="flPwTip"></label><select id="flPw" data-t="flPwTip"><option value="free" data-i="pwFree"></option><option value="normal" data-i="pwNormal" selected></option><option value="costly" data-i="pwCostly"></option></select></div>
      <div class="ctl"><label class="auto" data-t="flReflexTip"><input id="flReflex" type="checkbox" data-t="flReflexTip"> <span data-i="reflex"></span></label></div>
      <div class="ctl"><button id="flGo" type="button" data-i="go" data-t="goTip"></button><button id="flStop" type="button" data-i="stop" data-t="stopTip"></button></div>
      <div class="ctl"><label class="auto" data-t="chaseTip"><input id="flChase" type="checkbox" data-t="chaseTip"> <span data-i="chase"></span></label></div>
      <table id="flro"></table>
      <div class="dim" id="flNote"></div>
      <div class="warn" id="flSplash"></div>
    </div>
  </details>

  <details class="sec" open>
    <summary data-i="sec3" data-t="sec3Tip"></summary>
    <div class="ctl"><label for="spd" data-i="spd" data-t="spdTip"></label><input id="spd" type="range" min="0" max="4" step="0.1" value="1" data-t="spdTip"><span class="val" id="spdv"></span></div>
    <div class="ctl"><label class="auto" data-t="pauseTip"><input id="pause" type="checkbox" data-t="pauseTip"> <span data-i="pause"></span></label>
      <label class="auto" data-t="ptcTip"><input id="ptc" type="checkbox" checked data-t="ptcTip"> <span data-i="ptc"></span></label></div>
    <div class="ctl"><label class="auto" data-t="seaFollowTip"><input id="seaFollow" type="checkbox" checked data-t="seaFollowTip"> <span data-i="seaFollow"></span></label></div>
    <div class="dim" id="mastpos"></div>
    <div class="sub" data-i="mastVals"></div>
    <table id="ro"></table>
  </details>

  <details class="sec">
    <summary data-i="secCharts" data-t="secChartsTip"></summary>
    <div class="card"><div class="ct" data-i="ch1"></div><canvas id="ch1" width="280" height="170" data-t="ch1Tip"></canvas></div>
    <div class="card"><div class="ct" data-i="ch2"></div><canvas id="ch2" width="280" height="170" data-t="ch2Tip"></canvas></div>
  </details>

  <details class="sec">
    <summary data-i="secHelp" data-t="secHelpTip"></summary>
    <div class="dim" data-i="help1"></div>
    <div class="dim" data-i="help2"></div>
    <div class="dim" data-i="help3"></div>
    <div class="dim" data-i="help4"></div>
    <div class="dim" data-i="help5"></div>
  </details>
</div>
<div id="tip"></div>

<script src="field.js"></script>
<script src="traj.js"></script>
<script src="flight.js"></script>
<script src="aircraft.js"></script>
<script src="library.js"></script>
<script src="library_motor.js"></script>
<script src="seagen.js"></script>
<script src="envsea.js"></script>
<script src="gust.js"></script>
<script src="mpc.js"></script>
<script src="navigator.js"></script>
<script type="module">

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    if (SCEN) { setHour(hourNow); syncHour(); updateScRo(); } else { setHour(0); setWind(+u10El.value, +fromEl.value); }
  } else {
    if (prev === 'scenario') { u10El.value = Math.min(25, Math.max(2, W.u10)); fromEl.value = Math.round(W.from_deg) % 360; }
    rebuildSea();
    if (m === 'varying') startVarying();
  }
  syncLabels();
}
modeEl.addEventListener('change', () => applyEnvMode(false));
for (const el of [ageEl, $('swHs'), $('swTp'), $('swFrom')]) el.addEventListener('input', onWind);
$('swOn').addEventListener('change', () => {
  for (const id of ['swHs', 'swTp', 'swFrom']) $(id).disabled = !$('swOn').checked;
  scheduleRebuild();
});
for (const el of [slowEl, seedEl]) el.addEventListener('change', () => { if (ENV.mode === 'varying') startVarying(); });
const envRows = ['u10', 'du', 'hs', 'hsw'];
$('envro').innerHTML = envRows.map((r) => '<tr><td data-i="e_' + r + '"></td><td id="env_' + r + '"></td></tr>').join('');
function updateEnvRo() {
  const sg = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);
  $('env_u10').textContent = W.u10.toFixed(2) + ' m/s';
  $('env_du').textContent = ENV.mode === 'varying' ? sg(ENV.du) + ' m/s' : '-';
  const a = ENV.trains[0], b = ENV.trains[1];
  $('env_hs').textContent = a ? a.hs.toFixed(2) + ' m / ' + a.tp.toFixed(1) + ' s' : '-';
  $('env_hsw').textContent = b ? b.hs.toFixed(2) + ' m' : '-';
}
// strip chart of the last 5 minutes of the wind at 10 m at the mast
const STRIP_S = 300, SW = 280, SH = 96;
const gS = (() => {
  const cv = $('strip'), r = Math.min(devicePixelRatio || 1, 2);
  cv.width = SW * r; cv.height = SH * r;
  const g = cv.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0); return g;
})();
function drawStrip() {
  const ml = 30, mr = 8, mt = 16, mb = 24, pw = SW - ml - mr, ph = SH - mt - mb, g = gS;
  g.clearRect(0, 0, SW, SH); g.fillStyle = CS.surface; g.fillRect(0, 0, SW, SH);
  const S = ENV.samples;
  let lo = ENV.u0 - 1, hi = ENV.u0 + 1;
  for (const q of S) { lo = Math.min(lo, q[1], q[2]); hi = Math.max(hi, q[1], q[2]); }
  lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5);
  const xp = (t) => ml + (1 - (T - t) / STRIP_S) * pw, yp = (v) => mt + ph - (v - lo) / (hi - lo) * ph;
  g.font = '10px system-ui, sans-serif'; g.lineWidth = 1;
  g.strokeStyle = CS.grid; g.fillStyle = CS.text2; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (const v of [lo, (lo + hi) / 2, hi]) {
    const y = Math.round(yp(v)) + 0.5;
    g.beginPath(); g.moveTo(ml, y); g.lineTo(ml + pw, y); g.stroke();
    g.fillText(Number.isInteger(v) ? String(v) : v.toFixed(1), ml - 4, y);
  }
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (const a of [300, 200, 100, 0]) g.fillText(String(a), ml + (1 - a / STRIP_S) * pw, mt + ph + 3);
  g.fillText(tx('stripAxis'), ml + pw / 2, mt + ph + 13);
  const line = (k, col) => {
    g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath();
    let first = true;
    for (const q of S) { const x = xp(q[0]); if (x < ml) continue; if (first) { g.moveTo(x, yp(q[k])); first = false; } else g.lineTo(x, yp(q[k])); }
    g.stroke(); g.lineWidth = 1;
  };
  line(1, CS.s2); line(2, CS.s1);
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = CS.s1; g.fillText(tx('stripMean'), ml, 7);
  g.fillStyle = CS.s2; g.fillText(tx('stripAct'), ml + g.measureText(tx('stripMean')).width + 12, 7);
}
applyEnvMode(true);

// ---------------------------------------------------------------- main loop
let T = 0, last = performance.now();
const wv = { u: 0, v: 0, w: 0 };
const _dir = new THREE.Vector3();

// keep a particle inside the box of side SEA around the sea centre
function wrapParticle(i) {
  px[i] = seaC.x + (((px[i] - seaC.x + HALF) % SEA) + SEA) % SEA - HALF;
  py[i] = seaC.y + (((py[i] - seaC.y + HALF) % SEA) + SEA) % SEA - HALF;
}
function stepParticles(dt, t) {
  for (let i = 0; i < NP; i++) {
    surface(px[i], py[i], t);
    windAt(ph[i], wv, px[i], py[i], t);
    px[i] += wv.u * dt; py[i] += wv.v * dt;
    ph[i] = Math.min(40, Math.max(0.3, ph[i] + wv.w * dt));
    wrapParticle(i);
  }
}
function updateParticleBuffers(t) {
  for (let i = 0; i < NP; i++) {
    surface(px[i], py[i], t);
    pPos[3 * i] = px[i]; pPos[3 * i + 1] = surf.eta + ph[i]; pPos[3 * i + 2] = -py[i];
    ramp(ph[i], tmpC); pCol[3 * i] = tmpC.r; pCol[3 * i + 1] = tmpC.g; pCol[3 * i + 2] = tmpC.b;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

function loop(now) {
  requestAnimationFrame(loop);
  const real = Math.min(0.25, (now - last) / 1000); last = now;
  if (SCEN) {   // while a flight runs the scenario hour stays fixed, and its controls are locked
    for (const el of [hourEl, $('play')]) { el.disabled = FL.on; el.title = tx(FL.on ? 'frozenTip' : el === hourEl ? 'hourTip' : 'playTip'); }
  }
  if (SCEN && playing && !FL.on) {
    hourNow += real * (+rateEl.value);
    if (hourNow > 72) hourNow -= 72;   // loop
    hourEl.value = hourNow; setHour(hourNow); syncHour();
  }
  let dt = $('pause').checked ? 0 : real * (+spdEl.value);
  if (FL.on && dt > 0) dt = flightAdvance(dt, T);   // sea time follows the steps actually taken
  if (dt > 0) {
    const ns = Math.ceil(dt / 0.05), h = dt / ns;
    if (points.visible) for (let s = 0; s < ns; s++) stepParticles(h, T + s * h);
    T += dt;
  }
  envUpdate(T);   // the varying wind and the short waves at the new sea time
  if (ENV.dirty) { ENV.dirty = false; uploadC(); }
  {   // locks: the setting does not change in flight, and time runs in real seconds when the wind varies
    const lv = ENV.mode === 'varying';
    spdEl.disabled = $('pause').disabled = lv;
    spdEl.title = tx(lv ? 'lockVarTip' : 'spdTip');
    $('pause').title = $('pause').parentElement.title = tx(lv ? 'lockVarTip' : 'pauseTip');
    modeEl.disabled = FL.on; modeEl.title = tx(FL.on ? 'envLockTip' : 'envModeTip');
  }
  // the drawn sea follows the aircraft while it flies (display only; the flight model is analytic)
  {
    const fol = FL.on && $('seaFollow').checked;
    const nx = fol ? Math.round(FL.s[0]) : 0, ny = fol ? Math.round(FL.s[1]) : 0;
    if (nx !== seaC.x || ny !== seaC.y) {
      seaC.x = nx; seaC.y = ny; seaMat.uniforms.uOff.value.set(nx, ny);
      for (let i = 0; i < NP; i++) wrapParticle(i);
    }
  }
  seaMat.uniforms.uT.value = T;
  if (points.visible) updateParticleBuffers(T);

  // mast
  surface(mx, my, T);
  const eta = surf.eta;
  mastLine.position.set(mx, eta, -my);
  for (let j = 0; j < HM.length; j++) {
    windAt(HM[j], wv, mx, my, T);
    const sh = Math.hypot(wv.u, wv.v);
    spd[j] = sh; ww[j] = wv.w;
    const len = Math.max(0.02, Math.min(25, 0.6 * Math.hypot(sh, wv.w)));
    _dir.set(wv.u, wv.w, -wv.v); if (_dir.lengthSq() < 1e-12) _dir.set(1, 0, 0); _dir.normalize();
    arrows[j].position.set(mx, eta + HM[j], -my);
    arrows[j].setDirection(_dir);
    arrows[j].setLength(len, Math.min(len * 0.3, 1.2), Math.min(len * 0.15, 0.6));
    if (HM[j] === 2) { setRo('w2', sh.toFixed(2) + ' m/s'); setRo('vw2', wv.w.toFixed(2) + ' m/s'); }
    if (HM[j] === 10) { setRo('w10', sh.toFixed(2) + ' m/s'); ENV.w10 = sh; }
  }
  setRo('t', T.toFixed(1) + ' s'); setRo('u10', W.u10.toFixed(1) + ' m/s');
  setRo('us', W.ustar.toFixed(3) + ' m/s'); setRo('z0', W.z0.toExponential(2) + ' m');
  setRo('eta', eta.toFixed(2) + ' m');
  if (SCEN) updateScRo();
  if (ENV.mode !== 'scenario') updateEnvRo();
  if (ENV.mode === 'varying') {
    if (T >= ENV.nextSample) {
      ENV.samples.push([T, ENV.w10, W.u10]); ENV.nextSample = T + 0.5;
      while (ENV.samples.length && T - ENV.samples[0][0] > STRIP_S) ENV.samples.shift();
    }
    drawStrip();
  }
  $('mastpos').textContent = tx('mastPos', mx, my);
  drawCharts();

  updateGlider(T);
  updateFlightView();
  controls.update();
  renderer.render(scene, camera);
}
uiReady = true; applyLang();
requestAnimationFrame((now) => { last = now; loop(now); });
</script>
</body>
</html>
