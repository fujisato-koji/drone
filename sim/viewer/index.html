<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>海と風のシミュレータ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#cfe3f2 0%, #eef5fa 55%, #f7f4ea 100%);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #c { position: fixed; inset: 0; display: block; }
  #panel { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; box-sizing: border-box;
           padding: 10px; overflow-y: auto; background: rgba(20, 24, 30, 0.80); color: #e8ecef;
           font-size: 12px; line-height: 1.4; }
  #panel h1 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  #panel h3 { font-size: 12px; margin: 10px 0 3px; font-weight: 600; color: #e8ecef; }
  #panel .dim { color: #aab3bb; }
  #panel .warn { color: #ffcf6b; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 0 0 1px; }
  #panel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .ctl label { width: 112px; flex: none; }
  .ctl label.auto { width: auto; }
  .ctl.step label { width: 100px; }
  .ctl select { flex: 1; min-width: 0; }
  #panel .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  #panel .top button { flex: none; }
  #panel details.sec { margin: 12px 0 0; }
  #panel summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 0 3px; margin: 0 0 5px;
                   border-bottom: 1px solid rgba(255, 255, 255, 0.22); }
  #panel .sub { margin: 8px 0 2px; font-weight: 600; }
  #panel .hint { margin: -1px 0 3px 0; }
  .ctl input[type=range] { flex: 1; min-width: 0; }
  .ctl .val { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .card { background: #fcfcfb; color: #52514e; border-radius: 4px; padding: 4px 0 0; margin: 0 0 8px; width: 280px; }
  .card .ct { color: #0b0b0b; font-size: 12px; font-weight: 600; padding: 0 6px 2px; }
  .card canvas { display: block; width: 280px; height: 170px; }
  #tip { position: fixed; pointer-events: none; display: none; background: #0b0b0b; color: #f0efec;
         font-size: 11px; padding: 2px 6px; border-radius: 3px; z-index: 10; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="top"><h1 data-i="title"></h1><button id="lang" type="button" data-t="langTip"></button></div>
  <div class="dim" id="what" data-i="what"></div>
  <div class="dim" id="meta"></div>
  <div class="warn" id="warn"></div>

  <details class="sec" open>
    <summary id="sec1s" data-i="sec1"></summary>
    <div id="scen" style="display:none">
      <div class="ctl"><label for="hour" data-i="hour" data-t="hourTip"></label><input id="hour" type="range" min="0" max="72" step="0.1" value="0" data-t="hourTip"><span class="val" id="hourv"></span></div>

        <label for="rate" style="width:auto" data-i="rate" data-t="rateTip"></label>
        <select id="rate" data-t="rateTip"><option value="1">1 h/s</option><option value="3" selected>3 h/s</option><option value="6">6 h/s</option></select></div>
      <table id="sro"></table>
    </div>
    <div id="windCtl">

      <div class="ctl"><label for="from" data-i="from" data-t="fromTip"></label><input id="from" type="range" min="0" max="359" step="1" data-t="fromTip"><span class="val" id="fromv"></span></div>
    </div>
    <div class="dim" id="timeNote" data-i="timeNote"></div>
    <div class="dim" id="rough"></div>
    <div class="dim" id="lockNote" style="display:none"></div>
  </details>

  <details class="sec" open>
    <summary data-i="sec2" data-t="sec2Tip"></summary>
    <div id="fl">
      <div class="ctl step"><label for="flAc" data-i="stAc" data-t="flAcTip"></label><select id="flAc" data-t="flAcTip"></select></div>
      <div class="ctl step"><label for="flCyc" data-i="stCyc" data-t="flCycTip"></label><select id="flCyc" data-t="flCycTip"><option value="travel" data-i="cycTravel"></option><option value="loiter" data-i="cycLoiter"></option></select></div>
      <div class="ctl step"><label for="flPos" data-i="stPos" data-t="flPosTip"></label><select id="flPos" data-t="flPosTip"><option value="mast" data-i="posMast"></option><option value="click" data-i="posClick"></option></select></div>
      <div class="dim hint" id="flPt"></div>
      <div class="ctl step"><label for="flHead" data-i="stHead" data-t="flHeadTip"></label><select id="flHead" data-t="flHeadTip"><option value="up" data-i="hUp"></option><option value="down" data-i="hDown"></option><option value="left" data-i="hLeft"></option><option value="right" data-i="hRight"></option><option value="ref" data-i="hRef"></option></select></div>
      <div class="ctl"><button id="flGo" type="button" data-i="go" data-t="goTip"></button><button id="flStop" type="button" data-i="stop" data-t="stopTip"></button></div>
      <div class="ctl"><label class="auto" data-t="chaseTip"><input id="flChase" type="checkbox" data-t="chaseTip"> <span data-i="chase"></span></label></div>
      <table id="flro"></table>
      <div class="dim" id="flNote"></div>
      <div class="warn" id="flSplash"></div>
    </div>
  </details>

  <details class="sec" open>
    <summary data-i="sec3" data-t="sec3Tip"></summary>
    <div class="ctl"><label for="spd" data-i="spd" data-t="spdTip"></label><input id="spd" type="range" min="0" max="4" step="0.1" value="1" data-t="spdTip"><span class="val" id="spdv"></span></div>
    <div class="ctl"><label class="auto" data-t="pauseTip"><input id="pause" type="checkbox" data-t="pauseTip"> <span data-i="pause"></span></label>
      <label class="auto" data-t="ptcTip"><input id="ptc" type="checkbox" checked data-t="ptcTip"> <span data-i="ptc"></span></label></div>
    <div class="dim" id="mastpos"></div>
    <div class="sub" data-i="mastVals"></div>
    <table id="ro"></table>
  </details>

  <details class="sec">
    <summary data-i="secCharts" data-t="secChartsTip"></summary>
    <div class="card"><div class="ct" data-i="ch1"></div><canvas id="ch1" width="280" height="170" data-t="ch1Tip"></canvas></div>
    <div class="card"><div class="ct" data-i="ch2"></div><canvas id="ch2" width="280" height="170" data-t="ch2Tip"></canvas></div>
  </details>

  <details class="sec">
    <summary data-i="secHelp" data-t="secHelpTip"></summary>
    <div class="dim" data-i="help1"></div>
    <div class="dim" data-i="help2"></div>
    <div class="dim" data-i="help3"></div>
    <div class="dim" data-i="help4"></div>
    <div class="dim" data-i="help5"></div>
  </details>
</div>
<div id="tip"></div>

<script src="field.js"></script>
<script src="traj.js"></script>
<script src="flight.js"></script>
<script src="refs.js"></script>

let LANG = 'ja';
try { const s = localStorage.getItem('viewerLang'); if (s === 'ja' || s === 'en') LANG = s; } catch (e) { /* storage blocked */ }
const tx = (k, ...a) => {
  const v = I18N[LANG][k] !== undefined ? I18N[LANG][k] : I18N.en[k];
  return typeof v === 'function' ? v(...a) : (v === undefined ? k : v);
};
const dyn = [];            // functions that redraw script-made text; run on every language change
let uiReady = false;
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = tx('pageTitle');
  for (const el of document.querySelectorAll('[data-i]')) el.textContent = (el.dataset.pre || '') + tx(el.dataset.i);
  for (const el of document.querySelectorAll('[data-t]')) el.title = tx(el.dataset.t);
  $('lang').textContent = LANG === 'ja' ? 'English' : '日本語';
}
function applyLang() { applyStatic(); if (uiReady) for (const f of dyn) f(); }
$('lang').addEventListener('click', () => {
  LANG = LANG === 'ja' ? 'en' : 'ja';
  try { localStorage.setItem('viewerLang', LANG); } catch (e) { /* storage blocked */ }
  applyLang();
});

const F = window.FIELD;
if (!F) {
  applyStatic(); $('meta').textContent = tx('noField');

  FL.ac = ac; FL.tr = new Flight.Tracker(ref, ac);
  FL.s = [p.x, p.y, fSurface(p.x, p.y, T) + zr, V, gam, psi];
  FL.cl = 0; FL.mu = 0; FL.acc = 0; FL.el = 0; FL.trail = []; FL.splash = null; FL.started = true; FL.on = true;
  FL.uText = uUsed === null ? '-' : uUsed + ' / ' + W.u10.toFixed(1) + ' m/s';
  FL.refInfo = ref ? [cyc, ref.period] : null;
  splashMark.visible = false; splashLbl.style.display = 'none'; flSplashFn = () => ''; renderFl();
  buildShape(ac);
  flightMesh.visible = true;
}
$('flGo').addEventListener('click', launch);
$('flStop').addEventListener('click', stopFlight);

// pick the launch point by a click (not a drag) on the sea
{
  const cv = $('c'), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = new THREE.Vector3();
  let down = null;
  cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4 || performance.now() - down.t > 500) return;
    ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    if (!ray.ray.intersectPlane(plane, hit)) return;
    if (Math.abs(hit.x) > HALF || Math.abs(hit.z) > HALF) return;
    FL.pt = { x: +hit.x.toFixed(1), y: +(-hit.z).toFixed(1) };
    $('flPos').value = 'click';
    renderFl();
    ptMark.visible = true;
  });
}

// Advance the flight by up to dtWanted of sea time, starting at sea time t0; returns the sea
// time actually used (at most 20 steps of 0.01 s per frame, so the sea slows down if the
// machine cannot keep up).
function flightAdvance(dtWanted, t0) {
  FL.acc += dtWanted;
  let n = Math.floor(FL.acc / FDT + 1e-9);
  if (n > FMAX_STEPS) { n = FMAX_STEPS; FL.acc = 0; } else FL.acc -= n * FDT;
  let done = 0;
  for (let i = 0; i < n && FL.on; i++) {
    const t = t0 + i * FDT;
    const c = FL.tr.command(FL.s, fWind, fSurface, t);
    FL.cl = c.cl; FL.mu = c.mu;
    FL.s = Flight.rk4(FL.s, c.cl, c.mu, FL.ac, fWind, t, FDT);
    FL.el += FDT; done++;
    if (!FL.s.every(Number.isFinite)) { stopFlight(); { const ts = FL.el.toFixed(1); flSplashFn = () => tx('numFail', ts); renderFl(); } break; }
    const hgt = FL.s[2] - fSurface(FL.s[0], FL.s[1], t + FDT);
    if (Math.round(FL.el / FDT) % Math.round(TRAIL_DT / FDT) === 0) {
      FL.trail.push([FL.s[0], FL.s[2], -FL.s[1], hgt]);
      if (FL.trail.length > TRAIL_N) FL.trail.shift();
    }
    if (hgt < 0) {
      FL.splash = { x: FL.s[0], y: FL.s[1], z: FL.s[2], t: FL.el };
      splashMark.position.set(FL.s[0], FL.s[2], -FL.s[1]); splashMark.visible = true;
      { const ts = FL.el.toFixed(1); flSplashFn = () => tx('splashed', ts); renderFl(); }
      stopFlight();
      break;
    }
  }
  return done * FDT;
}
const _fp = new THREE.Vector3(), _fd = new THREE.Vector3();
function updateFlightView() {
  if (FL.pt) { surface(FL.pt.x, FL.pt.y, T); ptMark.position.set(FL.pt.x, surf.eta, -FL.pt.y); }
  if (!FL.started) return;
  const s = FL.s;
  flightMesh.position.set(s[0], s[2], -s[1]);
  flightMesh.rotation.set(-FL.mu, s[5], s[4]);   // x = bank (left wing down for mu > 0), y = heading, z = pitch
  // trail, ending at the aircraft
  const n = FL.trail.length;
  for (let i = 0; i < n; i++) {
    const q = FL.trail[i];
    trailPos.set([q[0], q[1], q[2]], i * 3);
    ramp(Math.max(0.3, q[3]), tmpC); trailCol.set([tmpC.r, tmpC.g, tmpC.b], i * 3);
  }
  const hnow = s[2] - fSurface(s[0], s[1], T);
  trailPos.set([s[0], s[2], -s[1]], n * 3);
  ramp(Math.max(0.3, hnow), tmpC); trailCol.set([tmpC.r, tmpC.g, tmpC.b], n * 3);
  trailGeo.setDrawRange(0, n + 1);
  trailGeo.attributes.position.needsUpdate = true; trailGeo.attributes.color.needsUpdate = true;
  // readouts
  const m = Flight.metrics(s, FL.ac, fWind, fSurface, T, FL.cl);
  const pa = FL.tr.passes;
  setFl('el', FL.el.toFixed(1) + ' s' + (FL.on ? '' : tx('stopped')));
  setFl('v', m.airspeed.toFixed(1) + ' m/s');
  setFl('h', m.height.toFixed(2) + ' m');
  setFl('e', (m.energy * Flight.G).toFixed(0) + ' J/kg');
  setFl('n', m.loadFactor.toFixed(2));
  setFl('ph', FL.tr.phase === null ? '-' : (FL.tr.phase / FL.tr.ref.n).toFixed(2));
  setFl('gd', FL.tr.guard ? tx('yes') : tx('no'));
  setFl('de', pa.length >= 2 ? ((pa[pa.length - 1].energy - pa[pa.length - 2].energy) * Flight.G).toFixed(1) + ' J/kg' : tx('na'));
  setFl('u', FL.uText); setFl('ref', FL.refInfo ? tx('refTxt', FL.refInfo[0], FL.refInfo[1]) : tx('refNone'));
  // splash label
  if (FL.splash) {
    _fp.set(FL.splash.x, FL.splash.z, -FL.splash.y).project(camera);
    if (_fp.z < 1) {
      splashLbl.style.display = 'block';
      splashLbl.textContent = tx('splashLbl', FL.splash.t.toFixed(1));
      splashLbl.style.left = ((_fp.x + 1) / 2 * innerWidth + 8) + 'px';
      splashLbl.style.top = ((1 - _fp.y) / 2 * innerHeight - 8) + 'px';
    } else splashLbl.style.display = 'none';
  }
  // chase camera: keep the orbit offset, move the target onto the aircraft
  if ($('flChase').checked) {

    camera.position.add(_fd); controls.target.copy(flightMesh.position);
  }
}

// ---------------------------------------------------------------- UI
const u10El = $('u10'), fromEl = $('from'), spdEl = $('spd');
u10El.value = W.u10; fromEl.value = Math.round(W.from_deg) % 360;
const hourEl = $('hour'), rateEl = $('rate');
let playing = false, hourNow = 0;   // hourNow keeps sub-step precision (the slider rounds to 0.1)
function syncHour() {
  $('hourv').textContent = (+hourEl.value).toFixed(1) + ' h';
  u10El.value = W.u10; fromEl.value = Math.round(W.from_deg) % 360;
  syncLabels();
}
const renderPlay = () => { $('play').textContent = playing ? tx('pauseBtn') : tx('play'); };
dyn.push(renderPlay);
if (SCEN) {
  $('scen').style.display = '';
  u10El.disabled = true; fromEl.disabled = true; $('windCtl').style.display = 'none';   // the scenario sets the wind
  hourEl.addEventListener('input', () => { hourNow = +hourEl.value; setHour(hourNow); syncHour(); });
  $('play').addEventListener('click', () => { playing = !playing; renderPlay(); });
}
function syncLabels() { $('u10v').textContent = (+u10El.value).toFixed(1) + ' m/s'; $('fromv').textContent = fromEl.value + ' deg'; $('spdv').textContent = (+spdEl.value).toFixed(1) + 'x'; }
function onWind() { if (SCEN) return; setWind(+u10El.value, +fromEl.value); syncLabels(); }
u10El.addEventListener('input', onWind); fromEl.addEventListener('input', onWind);
spdEl.addEventListener('input', syncLabels);
$('ptc').addEventListener('change', () => { points.visible = $('ptc').checked; });
syncLabels();
addEventListener('keydown', (e) => {
  const d = { ArrowLeft: [-5, 0], ArrowRight: [5, 0], ArrowUp: [0, 5], ArrowDown: [0, -5] }[e.key];
  if (!d) return;
  e.preventDefault();
  mx = Math.max(-HALF, Math.min(HALF, mx + d[0])); my = Math.max(-HALF, Math.min(HALF, my + d[1]));
});
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// readouts
const roRows = [['r_t', 't'], ['r_u10', 'u10'], ['r_us', 'us'], ['r_z0', 'z0']];
if (!SCEN) F.trains.forEach((tr, i) => roRows.push(['r_hsTp', 'tr' + i, tr.name]));
roRows.push(['r_eta', 'eta'], ['r_w2', 'w2'], ['r_w10', 'w10'], ['r_vw2', 'vw2']);
$('ro').innerHTML = roRows.map((r) => '<tr><td data-i="' + r[0] + '"' + (r[2] ? ' data-pre="' + r[2] + '"' : '') + '></td><td id="ro_' + r[1] + '"></td></tr>').join('');
const setRo = (k, s) => { $('ro_' + k).textContent = s; };
if (!SCEN) F.trains.forEach((tr, i) => setRo('tr' + i, tr.hs.toFixed(2) + ' m / ' + tr.tp.toFixed(1) + ' s'));
const scRows = ['hour', 'u10', 'from', 'hss', 'tps', 'hsw', 'us', 'z0', 'wc'];
$('sro').innerHTML = scRows.map((r) => '<tr><td data-i="s_' + r + '"></td><td id="sc_' + r + '"></td></tr>').join('');
const setSc = (k, s) => { $('sc_' + k).textContent = s; };
function updateScRo() {
  setSc('hour', SC.hour.toFixed(1) + ' h'); setSc('u10', W.u10.toFixed(1) + ' m/s');
  setSc('from', W.from_deg.toFixed(0) + ' deg'); setSc('hss', SC.hsSea.toFixed(2) + ' m');
  setSc('tps', SC.tpSea.toFixed(1) + ' s'); setSc('hsw', SC.hsSwell.toFixed(2) + ' m');
  setSc('us', W.ustar.toFixed(3) + ' m/s'); setSc('z0', W.z0.toExponential(2) + ' m');
  setSc('wc', (100 * SC.wc).toFixed(2) + ' %');
}
setHour(0);   // fill the merged components and the uniforms (after seaMat exists)
if (SCEN) { syncHour(); updateScRo(); }

// ---------------------------------------------------------------- charts
// series colours: first two categorical slots of the default palette (validated, light mode)
const CS = { surface: '#fcfcfb', text1: '#0b0b0b', text2: '#52514e', muted: '#898781', grid: '#e1e0d9', axis: '#c3c2b7', s1: '#2a78d6', s2: '#eb6834' };
const ML = 38, MR = 10, MT = 22, MB = 30, CW = 280, CH = 170;
const PW = CW - ML - MR, PH = CH - MT - MB;
function setupCanvas(cv) {
  const r = Math.min(devicePixelRatio || 1, 2);
  cv.width = CW * r; cv.height = CH * r;
  const g = cv.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0); return g;
}
const g1 = setupCanvas($('ch1')), g2 = setupCanvas($('ch2'));
const yPix = (h) => MT + PH - (h / 30) * PH;
let markers1 = [];
function frame(g, xmin, xmax, xticks, xlabel) {
  g.clearRect(0, 0, CW, CH);
  g.fillStyle = CS.surface; g.fillRect(0, 0, CW, CH);
  g.font = '10px system-ui, sans-serif'; g.lineWidth = 1;
  const xPix = (v) => ML + (v - xmin) / (xmax - xmin) * PW;
  g.strokeStyle = CS.grid; g.fillStyle = CS.text2; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (const h of [0, 10, 20, 30]) {
    const y = Math.round(yPix(h)) + 0.5;
    g.beginPath(); g.moveTo(ML, y); g.lineTo(ML + PW, y); g.stroke();
    g.fillText(String(h), ML - 4, y);
  }
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (const v of xticks) {
    const x = Math.round(xPix(v)) + 0.5;
    g.beginPath(); g.moveTo(x, MT); g.lineTo(x, MT + PH); g.stroke();
    g.fillText(Number.isInteger(v) ? String(v) : v.toFixed(1), x, MT + PH + 3);
  }
  g.strokeStyle = CS.axis;
  g.beginPath(); g.moveTo(ML + 0.5, MT); g.lineTo(ML + 0.5, MT + PH + 0.5); g.lineTo(ML + PW, MT + PH + 0.5); g.stroke();
  g.fillStyle = CS.text2; g.textAlign = 'center'; g.textBaseline = 'bottom';
  g.fillText(xlabel, ML + PW / 2, CH - 2);
  g.save(); g.translate(9, MT + PH / 2); g.rotate(-Math.PI / 2); g.textBaseline = 'top';
  g.fillText(tx('chY'), 0, 0); g.restore();
  return xPix;
}
function dot(g, x, y, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, 4, 0, 2 * Math.PI); g.fill(); }
const clampX = (x) => Math.max(ML + 4, Math.min(ML + PW - 4, x));
const spd = new Float64Array(HM.length), ww = new Float64Array(HM.length);
function drawCharts() {
  // chart 1
  const xmax = 1.3 * W.u10, step = xmax > 20 ? 10 : 5;
  const ticks = []; for (let v = 0; v <= xmax + 1e-9; v += step) ticks.push(v);
  const xp = frame(g1, 0, xmax, ticks, tx('ch1Axis'));
  g1.strokeStyle = CS.s1; g1.lineWidth = 2; g1.beginPath();
  for (let j = 0; j <= 60; j++) {
    const h = 0.05 * Math.pow(30 / 0.05, j / 60);
    const x = xp(Math.min(xmax, meanSpeed(h))), y = yPix(h);
    if (j) g1.lineTo(x, y); else g1.moveTo(x, y);
  }
  g1.stroke(); g1.lineWidth = 1;
  markers1 = [];
  for (let j = 0; j < HM.length; j++) {
    const x = clampX(xp(spd[j])), y = yPix(HM[j]);
    dot(g1, x, y, CS.s2); markers1.push({ x, y, h: HM[j], s: spd[j] });
  }
  // legend
  g1.font = '10px system-ui, sans-serif'; g1.textAlign = 'left'; g1.textBaseline = 'middle';
  g1.strokeStyle = CS.s1; g1.lineWidth = 2; g1.beginPath(); g1.moveTo(ML, 9); g1.lineTo(ML + 16, 9); g1.stroke(); g1.lineWidth = 1;
  g1.fillStyle = CS.text2; g1.fillText(tx('chLegMean'), ML + 20, 9);
  const lx = ML + 20 + g1.measureText(tx('chLegMean')).width + 14;
  dot(g1, lx, 9, CS.s2); g1.fillStyle = CS.text2; g1.fillText(tx('chLegAct'), lx + 8, 9);
  // chart 2
  const xp2 = frame(g2, -2, 2, [-2, -1, 0, 1, 2], tx('ch2Axis'));
  g2.strokeStyle = CS.muted; g2.beginPath(); g2.moveTo(Math.round(xp2(0)) + 0.5, MT); g2.lineTo(Math.round(xp2(0)) + 0.5, MT + PH); g2.stroke();
  for (let j = 0; j < HM.length; j++) dot(g2, clampX(xp2(ww[j])), yPix(HM[j]), CS.s2);
}
const tip = $('tip');
$('ch1').addEventListener('mousemove', (e) => {
  const r = e.target.getBoundingClientRect(), mxp = e.clientX - r.left, myp = e.clientY - r.top;
  let best = null, bd = 14;
  for (const m of markers1) { const d = Math.hypot(m.x - mxp, m.y - myp); if (d < bd) { bd = d; best = m; } }
  if (!best) { tip.style.display = 'none'; return; }
  tip.textContent = tx('chTip', best.h, best.s.toFixed(2));
  tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; tip.style.display = 'block';
});
$('ch1').addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ---------------------------------------------------------------- main loop
let T = 0, last = performance.now();
const wv = { u: 0, v: 0, w: 0 };
const _dir = new THREE.Vector3();

function stepParticles(dt, t) {
  for (let i = 0; i < NP; i++) {
    surface(px[i], py[i], t);
    windAt(ph[i], wv);
    px[i] += wv.u * dt; py[i] += wv.v * dt;
    ph[i] = Math.min(40, Math.max(0.3, ph[i] + wv.w * dt));
    if (px[i] > HALF) px[i] -= SEA; else if (px[i] < -HALF) px[i] += SEA;
    if (py[i] > HALF) py[i] -= SEA; else if (py[i] < -HALF) py[i] += SEA;
  }
}
function updateParticleBuffers(t) {
  for (let i = 0; i < NP; i++) {
    surface(px[i], py[i], t);
    pPos[3 * i] = px[i]; pPos[3 * i + 1] = surf.eta + ph[i]; pPos[3 * i + 2] = -py[i];
    ramp(ph[i], tmpC); pCol[3 * i] = tmpC.r; pCol[3 * i + 1] = tmpC.g; pCol[3 * i + 2] = tmpC.b;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

function loop(now) {
  requestAnimationFrame(loop);
  const real = Math.min(0.25, (now - last) / 1000); last = now;
  if (SCEN) {   // while a flight runs the scenario hour stays fixed, and its controls are locked
    for (const el of [hourEl, $('play')]) { el.disabled = FL.on; el.title = tx(FL.on ? 'frozenTip' : el === hourEl ? 'hourTip' : 'playTip'); }
  }
  if (SCEN && playing && !FL.on) {
    hourNow += real * (+rateEl.value);
    if (hourNow > 72) hourNow -= 72;   // loop
    hourEl.value = hourNow; setHour(hourNow); syncHour();
  }
  let dt = $('pause').checked ? 0 : real * (+spdEl.value);
  if (FL.on && dt > 0) dt = flightAdvance(dt, T);   // sea time follows the steps actually taken
  if (dt > 0) {
    const ns = Math.ceil(dt / 0.05), h = dt / ns;
    if (points.visible) for (let s = 0; s < ns; s++) stepParticles(h, T + s * h);
    T += dt;
  }
  seaMat.uniforms.uT.value = T;
  if (points.visible) updateParticleBuffers(T);

  // mast
  surface(mx, my, T);
  const eta = surf.eta;
  mastLine.position.set(mx, eta, -my);
  for (let j = 0; j < HM.length; j++) {
    windAt(HM[j], wv);
    const sh = Math.hypot(wv.u, wv.v);
    spd[j] = sh; ww[j] = wv.w;
    const len = Math.max(0.02, Math.min(25, 0.6 * Math.hypot(sh, wv.w)));
    _dir.set(wv.u, wv.w, -wv.v); if (_dir.lengthSq() < 1e-12) _dir.set(1, 0, 0); _dir.normalize();
    arrows[j].position.set(mx, eta + HM[j], -my);
    arrows[j].setDirection(_dir);
    arrows[j].setLength(len, Math.min(len * 0.3, 1.2), Math.min(len * 0.15, 0.6));
    if (HM[j] === 2) { setRo('w2', sh.toFixed(2) + ' m/s'); setRo('vw2', wv.w.toFixed(2) + ' m/s'); }
    if (HM[j] === 10) setRo('w10', sh.toFixed(2) + ' m/s');
  }
  setRo('t', T.toFixed(1) + ' s'); setRo('u10', W.u10.toFixed(1) + ' m/s');
  setRo('us', W.ustar.toFixed(3) + ' m/s'); setRo('z0', W.z0.toExponential(2) + ' m');
  setRo('eta', eta.toFixed(2) + ' m');
  if (SCEN) updateScRo();
  $('mastpos').textContent = tx('mastPos', mx, my);
  drawCharts();

  updateGlider(T);
  updateFlightView();
  controls.update();
  renderer.render(scene, camera);
}
uiReady = true; applyLang();
requestAnimationFrame((now) => { last = now; loop(now); });
</script>
