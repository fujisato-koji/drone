<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>海と風のシミュレータ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#cfe3f2 0%, #eef5fa 55%, #f7f4ea 100%);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #c { position: fixed; inset: 0; display: block; }
  #panel { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; box-sizing: border-box;
           padding: 10px; overflow-y: auto; background: rgba(20, 24, 30, 0.80); color: #e8ecef;
           font-size: 12px; line-height: 1.4; }
  #panel h1 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  #panel h3 { font-size: 12px; margin: 10px 0 3px; font-weight: 600; color: #e8ecef; }
  #panel .dim { color: #aab3bb; }
  #panel .warn { color: #ffcf6b; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 0 0 1px; }
  #panel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .ctl label { width: 112px; flex: none; }
  .ctl label.auto { width: auto; }
  .ctl.step label { width: 100px; }
  .ctl select { flex: 1; min-width: 0; }
  #panel .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  #panel .top button { flex: none; }
  #panel details.sec { margin: 12px 0 0; }
  #panel summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 0 3px; margin: 0 0 5px;
                   border-bottom: 1px solid rgba(255, 255, 255, 0.22); }
  #panel .sub { margin: 8px 0 2px; font-weight: 600; }
  #panel .hint { margin: -1px 0 3px 0; }
  .ctl input[type=range] { flex: 1; min-width: 0; }
  .ctl .val { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .card { background: #fcfcfb; color: #52514e; border-radius: 4px; padding: 4px 0 0; margin: 0 0 8px; width: 280px; }
  .card .ct { color: #0b0b0b; font-size: 12px; font-weight: 600; padding: 0 6px 2px; }
  .card canvas { display: block; width: 280px; height: 170px; }
  .card canvas#strip { height: 96px; }
  .ctl input[type=number] { width: 64px; }
  .ctl input[type=checkbox] { margin: 0 4px 0 0; }
  .card .cn { padding: 0 6px 5px; font-size: 11px; line-height: 1.35; }
  .card canvas#wdLeg { height: 46px; }
  #mapPanel { position: fixed; right: 10px; bottom: 10px; width: min(560px, calc(100vw - 330px)); box-sizing: border-box;
              background: #fcfcfb; color: #52514e; border-radius: 4px; padding: 6px 8px; font-size: 12px; line-height: 1.4;
              box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25); z-index: 5; }
  #mapPanel .mtop, #mapPanel .mrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 3px 0; }
  #mapPanel .mt { color: #0b0b0b; font-weight: 600; font-size: 13px; }
  #mapPanel select { flex: 1; min-width: 140px; }
  #mapPanel input[type=range] { flex: 1; min-width: 80px; }
  #mapPanel .val { min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  #mapPanel .dim { color: #6b6a65; }
  #mapPanel .warn { color: #a3470f; }
  #mapPanel label.auto { display: flex; align-items: center; gap: 3px; }
  #mapPanel .filebtn input { display: none; }
  #mapPanel .filebtn span { border: 1px solid #b9b8b1; border-radius: 3px; padding: 1px 6px; cursor: pointer; background: #f0efec; color: #0b0b0b; }
  #wmCv { display: block; width: 100%; aspect-ratio: 2 / 1; cursor: crosshair; border-radius: 2px; touch-action: none; }
  #wmLeg { display: block; width: 100%; height: 34px; }
  #mapShow { position: fixed; right: 10px; bottom: 10px; z-index: 5; display: none; }
  #tip { position: fixed; pointer-events: none; display: none; background: #0b0b0b; color: #f0efec;
         font-size: 11px; padding: 2px 6px; border-radius: 3px; z-index: 10; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="top"><h1 data-i="title"></h1><button id="lang" type="button" data-t="langTip"></button></div>
  <div class="dim" id="what" data-i="what"></div>
  <div class="warn" id="meta"></div>

  <details class="sec" open>
    <summary data-i="sec1" data-t="sec1Tip"></summary>
    <div class="ctl"><label for="envMode" data-i="envMode" data-t="envModeTip"></label><select id="envMode" data-t="envModeTip"><option value="free" data-i="emFree"></option><option value="world" data-i="emWorld"></option></select></div>
    <div id="freeCtl">
      <div class="ctl"><label for="u10" data-i="u10" data-t="u10Tip"></label><input id="u10" type="range" min="2" max="25" step="0.5" value="10" data-t="u10Tip"><span class="val" id="u10v"></span></div>
      <div class="ctl"><label for="from" data-i="from" data-t="fromTip"></label><input id="from" type="range" min="0" max="359" step="1" value="270" data-t="fromTip"><span class="val" id="fromv"></span></div>
      <div class="ctl"><label for="age" data-i="age" data-t="ageTip"></label><input id="age" type="range" min="0" max="5" step="1" value="0" data-t="ageTip"><span class="val" id="agev"></span></div>
      <div class="ctl"><label for="swType" data-i="swType" data-t="swTypeTip"></label><select id="swType" data-t="swTypeTip"><option value="none" data-i="swNone"></option><option value="irregular" data-i="swIrr"></option><option value="regular" data-i="swReg"></option></select></div>
      <div id="irrCtl" style="display:none">
        <div class="ctl"><label for="swHs" data-i="swHs" data-t="swHsTip"></label><input id="swHs" type="range" min="0.2" max="4" step="0.1" value="1" data-t="swHsTip"><span class="val" id="swHsv"></span></div>
        <div class="ctl"><label for="swTp" data-i="swTp" data-t="swTpTip"></label><input id="swTp" type="range" min="6" max="18" step="0.5" value="11" data-t="swTpTip"><span class="val" id="swTpv"></span></div>
        <div class="ctl"><label for="swFrom" data-i="swFrom" data-t="swFromTip"></label><input id="swFrom" type="range" min="0" max="359" step="1" value="200" data-t="swFromTip"><span class="val" id="swFromv"></span></div>
      </div>
      <div id="swellCtl" style="display:none">
        <div class="ctl"><label for="swlHs" data-i="swlHs" data-t="swlHsTip"></label><select id="swlHs" data-t="swlHsTip"><option value="1.5">1.5 m</option><option value="2">2 m</option><option value="3" selected>3 m</option></select></div>
        <div class="ctl"><label for="swlTp" data-i="swlTp" data-t="swlTpTip"></label><select id="swlTp" data-t="swlTpTip"><option value="8">8 s</option><option value="10" selected>10 s</option><option value="12">12 s</option></select></div>
        <div class="ctl"><label for="swlDir" data-i="swlDir" data-t="swlDirTip"></label><select id="swlDir" data-t="swlDirTip"><option value="along" data-i="dAlong"></option><option value="across" data-i="dAcross"></option><option value="against" data-i="dAgainst"></option></select></div>
        <div class="ctl"><label for="swlPre" data-i="swlPre" data-t="swlPreTip"></label><select id="swlPre" data-t="swlPreTip"><option value="p63" data-i="preP63"></option><option value="p64_low" data-i="preP64"></option></select></div>
        <div class="dim" data-i="swlWindNote"></div>
        <table id="swro"></table>
      </div>
      <table id="envro"></table>
    </div>
    <div id="worldCtl" style="display:none">
      <table id="wro"></table>
      <div class="warn" id="wWarn"></div>
      <div class="dim" id="wNote" data-i="worldNote"></div>
    </div>
    <div class="ctl"><label class="auto" id="varyLbl" data-t="varyTip"><input id="vary" type="checkbox" checked data-t="varyTip"><span data-i="vary"></span></label></div>
    <div id="varCtl" style="display:none">
      <div class="dim" id="varWorldNote" data-i="varWorldNote" style="display:none"></div>
      <div class="ctl" id="slowCtl"><label for="slowKind" data-i="slowKind" data-t="slowKindTip"></label><select id="slowKind" data-t="slowKindTip"><option value="calm" data-i="skCalm"></option><option value="cell" data-i="skCell"></option></select></div>
      <div class="ctl"><label for="envSeed" data-i="envSeed" data-t="envSeedTip"></label><input id="envSeed" type="number" min="1" max="999999" step="1" value="1" data-t="envSeedTip"></div>
      <div class="card"><div class="ct" data-i="stripT" data-t="stripTip"></div><canvas id="strip" width="280" height="96" data-t="stripTip"></canvas></div>
    </div>
    <div class="dim" id="rough"></div>
  </details>

  <details class="sec" open>
    <summary data-i="sec2" data-t="sec2Tip"></summary>
    <div id="fl">
      <div class="ctl step"><label for="flAc" data-i="stAc" data-t="flAcTip"></label><select id="flAc" data-t="flAcTip"></select></div>
      <div class="ctl step"><label for="flHead" data-i="stHead" data-t="flHeadTip"></label><select id="flHead" data-t="flHeadTip"><option value="up" data-i="hUp"></option><option value="down" data-i="hDown"></option><option value="left" data-i="hLeft"></option><option value="right" data-i="hRight"></option><option value="ref" data-i="hRef"></option></select></div>
      <div class="ctl step"><label for="flTgt" data-i="stTgt" data-t="flTgtTip"></label><select id="flTgt" data-t="flTgtTip"><option value="none" data-i="tgtNone"></option><option value="click" data-i="tgtClick"></option></select></div>
      <div id="tgtCtl" style="display:none">
        <div class="dim hint" id="tgtPt"></div>
        <div class="ctl"><label for="tgtDist" data-i="tgtDist" data-t="tgtDistTip"></label><input id="tgtDist" type="number" min="100" max="20000" step="100" value="1000" style="width:64px" data-t="tgtDistTip"><select id="tgtDir" data-t="tgtDistTip"><option value="up" data-i="tdUp"></option><option value="down" data-i="tdDown"></option><option value="across" data-i="tdAcross"></option></select><button id="tgtSet" type="button" data-i="tgtSet" data-t="tgtDistTip"></button></div>
        <div class="card"><div class="ct" data-i="hullT" data-t="hullTip"></div><canvas id="hullCv" width="280" height="200" data-t="hullTip"></canvas></div>
      </div>
      <div class="ctl step"><label for="flMotor" data-i="stMotor" data-t="flMotorTip"></label><select id="flMotor" data-t="flMotorTip"><option value="off" data-i="motorOff"></option><option value="on" data-i="motorOn"></option></select></div>
      <div class="ctl step"><label for="flPw" data-i="stPw" data-t="flPwTip"></label><select id="flPw" data-t="flPwTip"><option value="free" data-i="pwFree"></option><option value="normal" data-i="pwNormal" selected></option><option value="costly" data-i="pwCostly"></option></select></div>
      <div class="ctl"><label class="auto" data-t="flReflexTip"><input id="flReflex" type="checkbox" data-t="flReflexTip"> <span data-i="reflex"></span></label></div>
      <div class="ctl"><button id="flGo" type="button" data-i="go" data-t="goTip"></button><button id="flStop" type="button" data-i="stop" data-t="stopTip"></button></div>
      <div class="ctl"><label for="flCam" data-i="cam" data-t="camTip"></label><select id="flCam" data-t="camTip"><option value="free" data-i="camFree"></option><option value="chase" data-i="camChase"></option><option value="fwd" data-i="camFwd"></option><option value="tip" data-i="camTipV"></option></select></div>
      <div class="dim" id="swlFixed" style="display:none" data-i="swlFixed"></div>
      <table id="flro"></table>
      <div class="sub" id="wvHead" style="display:none" data-i="wvHead" data-t="wvHeadTip"></div>
      <table id="wvro" style="display:none"></table>
      <div class="dim" id="flNote"></div>
      <div class="warn" id="flSplash"></div>
    </div>
  </details>

  <details class="sec" open>
    <summary data-i="sec3" data-t="sec3Tip"></summary>
    <div class="ctl"><label for="spd" data-i="spd" data-t="spdTip"></label><input id="spd" type="range" min="0" max="4" step="0.1" value="1" data-t="spdTip"><span class="val" id="spdv"></span></div>
    <div class="ctl"><label class="auto" data-t="pauseTip"><input id="pause" type="checkbox" data-t="pauseTip"> <span data-i="pause"></span></label></div>
    <div class="sub" data-i="wdHead" data-t="wdHeadTip"></div>
    <div class="ctl"><label class="auto" data-t="wdAcTip"><input id="wdAc" type="checkbox" checked data-t="wdAcTip"> <span data-i="wdAc"></span></label></div>
    <div class="ctl"><label class="auto" data-t="wdL5Tip"><input id="wdL5" type="checkbox" data-t="wdL5Tip"> <span data-i="wdL5"></span></label></div>
    <div class="ctl"><label class="auto" data-t="wdL2Tip"><input id="wdL2" type="checkbox" checked data-t="wdL2Tip"> <span data-i="wdL2"></span></label></div>
    <div class="card"><div class="ct" data-i="wdLegT" data-t="wdLegTip"></div><canvas id="wdLeg" width="280" height="46" data-t="wdLegTip"></canvas><div class="cn" id="wdNote"></div></div>
    <div class="ctl"><label class="auto" data-t="ptcTip"><input id="ptc" type="checkbox" data-t="ptcTip"> <span data-i="ptc"></span></label></div>
    <div class="ctl"><label class="auto" data-t="seaFollowTip"><input id="seaFollow" type="checkbox" checked data-t="seaFollowTip"> <span data-i="seaFollow"></span></label></div>
    <div class="dim" id="mastpos"></div>
    <div class="sub" data-i="mastVals"></div>
    <table id="ro"></table>
  </details>

  <details class="sec">
    <summary data-i="secCharts" data-t="secChartsTip"></summary>
    <div class="card"><div class="ct" data-i="ch1"></div><canvas id="ch1" width="280" height="170" data-t="ch1Tip"></canvas></div>
    <div class="card"><div class="ct" data-i="ch2"></div><canvas id="ch2" width="280" height="170" data-t="ch2Tip"></canvas></div>
  </details>

  <details class="sec">
    <summary data-i="secHelp" data-t="secHelpTip"></summary>
    <div class="dim" data-i="help1"></div>
    <div class="dim" data-i="help2"></div>
    <div class="dim" data-i="help3"></div>
    <div class="dim" data-i="help4"></div>
    <div class="dim" data-i="help5"></div>
    <div class="dim" data-i="help6"></div>
  </details>
</div>
<div id="tip"></div>
<div id="mapPanel">
  <div class="mtop"><span class="mt" data-i="mapTitle"></span><select id="wmScen" data-t="wmScenTip"></select>
    <button id="wmFitW" type="button" data-i="wmFitW" data-t="wmFitWTip"></button><button id="wmFitC" type="button" data-i="wmFitC" data-t="wmFitCTip"></button><button id="wmFitA" type="button" data-i="wmFitA" data-t="wmFitATip"></button><button id="wmHide" type="button" data-i="wmHide" data-t="wmHideTip"></button></div>
  <canvas id="wmCv" data-t="wmCvTip"></canvas>
  <div class="mrow"><label for="wmTime" data-i="wmTime" data-t="wmTimeTip"></label><input id="wmTime" type="range" min="0" max="72" step="0.25" value="0" data-t="wmTimeTip"><span class="val" id="wmTimev"></span></div>
  <div class="mrow"><span id="wmPick"></span></div>
  <div class="mrow"><button id="wmEnter" type="button" data-i="wmEnter" data-t="wmEnterTip"></button><button id="wmNow" type="button" data-i="wmNow" data-t="wmNowTip"></button><label class="auto" data-t="wmNowGlobTip"><input id="wmNowGlob" type="checkbox" data-t="wmNowGlobTip"><span data-i="wmNowGlob"></span></label><button id="wmSave" type="button" data-i="wmSave" data-t="wmSaveTip"></button><label class="filebtn" data-t="wmFileTip"><input id="wmFile" type="file" accept=".js,.json"><span data-i="wmFile"></span></label></div>
  <div class="mrow dim" id="wmNowNote"></div>
  <div class="mrow warn" id="wmMsg"></div>
  <canvas id="wmLeg" data-t="wmLegTip"></canvas>
  <div class="dim" id="wmAttr"></div>
</div>
<button id="mapShow" type="button" data-i="mapShow" data-t="mapShowTip"></button>

<script src="field.js"></script>
<script src="flight.js"></script>
<script src="aircraft.js"></script>
<script src="library.js"></script>
<script src="library_motor.js"></script>
<script src="seagen.js"></script>
<script src="envsea.js"></script>
<script src="gust.js"></script>
<script src="mpc.js"></script>
<script src="navigator.js"></script>
<script src="windvis.js"></script>
<script src="wave/index.js"></script>
<script src="wave.js"></script>
<script src="worlddata.js"></script>
<script src="worldmap.js"></script>
<script src="world/land.js"></script>
<script src="world/index.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
// ---------------------------------------------------------------- language (ja / en)
const I18N = {

    swNone: 'なし', swIrr: '不規則波', swReg: '規則波（波乗りの表で飛ぶ）',

    varyLockTip: '飛行中は変動の有無を変えられません。',
    varWorldNote: '回廊の値に突風を加えています。平均の風のゆっくりした変化は、回廊のデータの時間変化だけです。',

    skCalm: '穏やか', skCell: '対流セル',
    envSeed: '乱数の種', envSeedTip: 'ゆるやかな変化と突風の乱数の種です。同じ値なら、変動を加えた時点から同じ変動になります。',

    stripAxis: '秒前', stripMean: '平均の風', stripAct: '観測柱の値',
    e_u10: 'いまの平均の風（10 m）', e_du: '平均の風の変化', e_hs: '風浪の波高と周期', e_hsw: 'うねりの波高',

  en: {
    pageTitle: 'Sea and wind', title: 'Sea and wind simulator',
    what: 'Shows the sea and wind you set, at 1:1 scale.',
    langTip: '表示言語を切り替えます。Switches the display language.',
    sec1: '1. Sea and wind setting',
    sec1Tip: 'With "Free setting" the sliders choose the sea and wind. With "World seas" they are those of the place and time chosen on the world map.',
    envMode: 'Setting', envModeTip: '"Free setting" lets you choose the 10 m wind speed and direction, the sea development and a swell (none, irregular or regular). "World seas" is the real sea and wind (the corridor data) of the place and time chosen on the world map. "Add variation" adds gusts and more to either.',
    emFree: 'Free setting',
    age: 'Sea development', ageTip: 'Time since the wind began. The left end is a fully developed sea; further right is a younger sea that has had less time to grow. A shorter time gives lower and shorter waves.',
    ageRegTip: 'The sea of the regular swell has no wind sea, so the development is not used.',
    ageFull: 'Fully developed', ageH: (h) => h + ' h',
    swType: 'Swell', swTypeTip: 'A long-period wave from a direction of its own. "Irregular" is a swell of many components with the chosen height, period and direction, on top of the wind sea. "Regular (fly the wave library)" is a sea of one regular long-crested wave only, flown with the wave library solved in Python (the wave-synchronized flights). Choosing it snaps the height, the period and the direction relative to the wind to the nearest point of the library\'s grid, and leaves out the wind sea and the variation.',
    swNone: 'None', swIrr: 'Irregular', swReg: 'Regular (fly the wave library)',
    swHs: 'Swell height', swHsTip: 'Significant height of the swell.',
    swTp: 'Swell period', swTpTip: 'Peak period of the swell. Longer means a longer wavelength.',
    swFrom: 'Swell from', swFromTip: 'Direction the swell comes from. 0 deg is north, 90 deg is east.',
    vary: 'Add variation', varyTip: 'The mean wind changes slowly in time, gusts blow, and the short waves follow the change of the mean wind with a delay. In "World seas" the gusts are added to the corridor values; the slow change of the mean wind is only the corridor data\'s own change in time, with no second slow change on top, and the short waves are rebuilt for the interpolated mean wind. In both, time runs in real seconds. On by default; the regular swell turns it off, and leaving the regular swell brings it back as it was.',
    varyRegTip: 'The regular swell is the sea of the wave library (the sea of the Python runs), so no variation can be added.',
    varyLockTip: 'Variation cannot be switched while flying.',
    varWorldNote: 'Gusts are added to the corridor values; the slow change of the mean wind is only the corridor data\'s own change in time.',
    slowKind: 'Slow change', slowKindTip: 'Slow change of the mean wind. "Calm" is a drift with a standard deviation of about 0.3 m/s over periods of 6 h to 10 min. "Convection cells" is a quasi-periodic swing with a period of 30 to 60 min and an amplitude of 2 to 4 m/s.',
    skCalm: 'Calm', skCell: 'Convection cells',
    envSeed: 'Random seed', envSeedTip: 'Seed of the slow change and the gusts. The same value gives the same variation from the moment it is added.',
    stripT: 'Wind at 10 m, last 5 min', stripTip: 'Wind speed at 10 m at the mast. The orange line includes gusts and waves, the blue line is the mean wind. Time runs in real seconds.',
    stripAxis: 's ago', stripMean: 'mean wind', stripAct: 'at the mast',
    e_u10: 'Mean wind now (10 m)', e_du: 'Change of the mean wind', e_hs: 'Wind sea height / period', e_hsw: 'Swell height',
    lockVarTip: 'With "Add variation" time runs in real seconds, so this cannot be changed.',
    envLockTip: 'The setting cannot be changed while flying.',
    swTypeLockTip: 'While flying the swell cannot be switched to or from the regular swell.',
    u10: 'Wind at 10 m', u10Tip: 'Wind speed at 10 m height. The sea state follows it.',
    from: 'Wind from', fromTip: 'Direction the wind comes from. 0 deg is north, 90 deg is east.',
    sec2: '2. Fly an aircraft', sec2Tip: 'Choose from the top down, then press Launch. The aircraft launches at the mast. The MPC predicts the flight with the waves on screen (the 48 strongest components) and the mean wind of the moment; it does not know the gusts ahead.',
    stAc: '1. Aircraft', flAcTip: 'Chooses the aircraft to fly.',
    stHead: '2. Heading', flHeadTip: 'The heading at launch and, without a destination, the course flown, both relative to the wind. A change in flight takes effect from the next plan: the planner turns to the cycle of the new course (with Motor assist On, on a course the wind alone makes no progress on, a steady powered leg aimed by the wind triangle). A change between soaring cycles waits up to 15 s for the phase where the new cycle matches the aircraft\'s state, and where the new cycle matches at no phase it goes through cycles that match one another. In flight the kind of leg does not change: a soaring flight flies a course that needs the motor on the soaring cycle that gets furthest along it, and a steady powered leg stays one, turning by up to 10 deg a second. "Reference heading" flies the reference course 20 deg off downwind and launches on the heading of its first cycle at the cycle\'s highest point.',
    flHeadTgtTip: 'With a destination the navigation decides the heading, so this cannot be chosen; set the destination to "None" to choose it.',
    flHeadRegTip: 'Over the regular swell the course is fixed along the swell, so this cannot be chosen.',

    motorOff: 'Off', motorOn: 'On',
    stPw: 'Power weight', flPwTip: 'The weight on the electric energy the motor uses. "Spare no power" hardly cares, "Normal" is in between, "Save power" cares a lot. Too much saving and the MPC does not use the motor even when it is needed, and may splash. Active only when Motor assist is On.',
    pwFree: 'Spare no power', pwNormal: 'Normal', pwCostly: 'Save power',
    reflex: 'Reflex when in danger (motor)', flReflexTip: 'At every control step, predicts the next 1.5 s of the plan as commanded; if the centre or a wingtip is predicted below 0.3 m above the surface, or the airspeed below 1.05 stall speeds, it switches to full thrust and a pull-up (lift coefficient to its margin limit, wings level) until the prediction clears, then hands back to the MPC. Active only when Motor assist is On.',
    f_rf: 'Reflexes', f_rf_tip: 'Number of reflexes and the electric energy they used. Filled when the reflex is on.',
    go: 'Launch', goTip: 'Launches the aircraft with the chosen settings.', stop: 'Stop', stopTip: 'Stops the flight. The aircraft and trail stay.',
    cam: 'Camera', camTip: '"Free (mouse)" orbits with the mouse. "Chase" keeps the camera target on the aircraft. "On board (forward)" looks from the aircraft along its air-relative velocity, rolled with the bank and pitched with the flight-path angle. "On board (under the wingtip)" looks from above the lower wing down past its tip at the water under it. Both onboard views have a vertical field of view of 70 deg, overlay a horizon line, the height above the surface and the airspeed, and smooth the orientation a little so that bank changes do not shake the view. Before a launch they stand at the mast at the launch heading and the height of the first cycle, and hide the mast. The low wingtip\'s height is the one the contact check uses. On board, the wind arrows around the aircraft are hidden (the layer at the aircraft\'s height passes through the eye, and the others are seen edge on).',

    pause: 'Freeze waves', pauseTip: 'Stops the wave motion.',
    ptc: 'Show wind particles', ptcTip: 'Shows particles carried by the wind. They show how the air moves over time, but they are hard to read and heavy, so they are off by default.',
    wdHead: 'Wind around the aircraft',

const CO = { a: new Float64Array(MAXM), k: new Float64Array(MAXM), omega: new Float64Array(MAXM),

function surface(x, y, t) {

    const th = CO.k[i] * (CO.dx[i] * x + CO.dy[i] * y) - CO.omega[i] * t + CO.phase[i];
    const c = Math.cos(th), s = Math.sin(th);

// (the corridor of the world map). With the variation (ENV.vary) in the free setting the wind at sea time t is
//   mean 10 m wind U(t) = u0 + slow(t - t0)   (W.u10 and W.ustar are scaled to it, z0 stays),
//   gusts from a frozen turbulence field carried by the set wind u0 (windAt adds them),
//   short waves (period under 2 s): amplitude times (lagged U / u0)^2, lagged with the response time of
//   their period (gust.js). The dominant sea keeps the set amplitudes.
// In the world seas the variation adds only the gusts: the mean wind changes only as the corridor does (over hours),

// do not jump: windAt evaluates it at (x - gox, y - goy) and the time since gt0.
function gustRebase(t) {

function windAt(h, o, gx, gy, gt) {

    _dir.set(wv.u, wv.w, -wv.v); if (_dir.lengthSq() < 1e-12) _dir.set(1, 0, 0); _dir.normalize();
    arrows[j].position.set(mx, eta + HM[j], -my);
    arrows[j].setDirection(_dir);
    arrows[j].setLength(len, Math.min(len * 0.3, 1.2), Math.min(len * 0.15, 0.6));
    if (HM[j] === 2) { setRo('w2', sh.toFixed(2) + ' m/s'); setRo('vw2', wv.w.toFixed(2) + ' m/s'); }
    if (HM[j] === 10) { setRo('w10', sh.toFixed(2) + ' m/s'); ENV.w10 = sh; }
  }
  setRo('t', T.toFixed(1) + ' s'); setRo('u10', W.u10.toFixed(1) + ' m/s');
  setRo('us', W.ustar.toFixed(3) + ' m/s'); setRo('z0', W.z0.toExponential(2) + ' m');
  setRo('eta', eta.toFixed(2) + ' m');
  if (ENV.mode === 'free') updateEnvRo();
  if (ENV.vary) {
    if (T >= ENV.nextSample) {
      ENV.samples.push([T, ENV.w10, W.u10]); ENV.nextSample = T + 0.5;
      while (ENV.samples.length && T - ENV.samples[0][0] > STRIP_S) ENV.samples.shift();
    }
    drawStrip();
  }
  $('mastpos').textContent = tx('mastPos', mx, my);
  drawCharts();

  updateFlightView();
  wdTick(now);
  if (!camUpdate(now)) controls.update();   // the onboard views own the camera
  renderer.render(scene, camera);
}
uiReady = true; applyLang();
requestAnimationFrame((now) => { last = now; loop(now); });
</script>
