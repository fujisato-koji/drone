    detail: "A separate checker, told to refute, worked on 4290a06 with its own model (COARE 3.5, the P63 and P64 low wave wind, a second-order surface, a parabolic polar with the folded propeller, a point-mass RK4) and reruns of the project's jobs. Thirteen reruns (three diagnosis runs, four closed-loop runs, two sensing runs, both navigation runs and the calm swell run) reproduced the record to the bit. Its wind and surface match the simulator's to 1e-3 m/s. It confirmed the following. The crest-ride existence counts match in all 36 groups. The rides' energy balance closes to 3e-3 W. The optimizer's cycles close within 1 mm on the linear surface and 3 cm on the second-order one, with heights between nodes down to 1.97 m. The closed-loop summary keys recompute. Energy from thrust and airspeed equals the record's. The logged dynamics match its own to 2e-4 m/s2 in the median, so no energy source is hidden. The counts hold at full resolution. Every hull point of the 3 m swell along 6 m/s travels with the swell. It refuted the following. The crest side is not phase-stable: with the controls held, a 0.2 m/s error grows about threefold in 40 s on either side, in its model and in derivs_wave. crest_entries drops the slowest soaring along-crest speed in 12 of 104 seas, among them the sea of the navigation and sensing runs (13 m/s kept where 6 to 8 m/s soar). Rides soar up to about 23 m there, and the run with the swell height a fifth low climbed to a median of 18.8 m. The 3 m/s runs failed by losing the forward face (83% of the time behind the crest, motor on 99%), not by a low family. In 20 of the 56 loop seas the library has no soaring entry. One motor cycle needs 50.6 W. At 0.6 rad the flight stays in the band and breaks the stall margin. The height x0.8 case flies the 2 m swell's entry, so it does not test a height error. The along-swell stall dip was 24 s after the last gybe. wave.nav_hull_ms is the first leg's speed, not the kinematic run's. Across the swell the aircraft flew 50 to 70 deg off the commanded course, and its wingtip went down to 0.08 m, which flight_margins missed by subsampling. Four cited keys do not exist. Several results are restated in prose. tdr check passes and 325 tests pass. The document was corrected. After the fixes (crest_entries' speed search, flight_margins at every step) the reruns at 5ddb018 changed these numbers. Crest rides: 12 seas gained their slowest soaring speed (6.5 instead of 13 m/s along the crest over the 3 m swell along 6 m/s). Closed loop: the two runs of that sea with P63 changed, the albatross-like glider from 3.49 to 1.95 W after the entry and the baseline from 1.74 to 1.13 W, so wave.loop_ratio_min went from 0.095 to 0.093 and wave.loop_motor_share_min from 0.031 to 0.022; every count, end and other power is the same, and the seas with only a motor crest ride are 20 (wave.loop_cases_motor_crest_only). Sensing, now on the slower ride: with the sea as it is 3.48 to 1.87 W; +0.15 rad 3.48 to 2.93 W; +0.3 rad 3.75 to 5.20 W; +0.6 rad now sinks out of the band (median height 0.5 m) without falling below the stall speed, 5.48 to 20.62 W; +1.2 rad 16.73 to 39.56 W; -0.6 rad now counts, 8.13 to 1.13 W; height x1.2 3.30 to 1.84 W; height x0.8 unchanged (it flies the 2 m swell's entry); a new case, height x0.9, keeps the 3 m entry and counts at 1.88 W. Navigation along the swell: it now counts, 307.96 s at 15.59 m/s for 0.28 Wh with no time below the stall speed (it was 315.09 s, 15.23 m/s, 0.38 Wh and a 0.49 s stall dip); across the swell unchanged, with the wingtip at 0.08 m and 94 s below the stall speed now in the record and the heading 48 to 55 deg off the commanded bearing as the median of each four-minute window. wave.nav_hull_ms was renamed wave.nav_first_leg_vmg_ms, with wave.nav_hull_vmg_ms for the kinematic run's speed. The flat-sea navigation runs (nav_exp, nav_exp_10km) keep every count; their lowest wingtips at full resolution are at most 0.01 m lower."
