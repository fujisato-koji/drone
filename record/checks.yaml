    tier: T2
    method: hand_calc
    result: pass
    by: checker
    date: 2026-10-29
    detail: A separate checker read sim/seawind.py and sim/structure.py and recomputed by hand the log-profile fixed point (u* 0.3707, z0 2.06e-4), the PM relations (Hs 2.414 m, Tp 7.755 s), the JONSWAP integral (4 sqrt(m0)/Hs within 0.3%), the potential-flow perturbation and its signs, the surface slope and orbital terms, the elliptical lift integrals, the tube inertia and root stress (margin 0.081), the tip deflection (ratio 0.1405 by a closed form), and the spar fit. All matched the code; the only error was the tube inertia stated in the brief itself (1.09e-10 instead of 1.69e-10 m4), not in the code. Observed, not an error, that orbital() has no depth decay and that the perturbation decays from the local surface.
  - id: K-004
    target:
      - R-02
      - R-12
    tier: T2
    method: hand_calc
    result: partial
    by: checker
    date: 2026-10-29
    detail: A separate checker derived the point-mass equations in the air-relative frame with the wind acceleration as a pseudo-force and matched sim/aircraft.py line by line; numerical residuals 1e-14 in a linear wind field; energy conservation without drag to 4.5e-7 m; uniform wind leaves the air-relative motion unchanged; climbing into increasing headwind gains energy as derived; best L/D 26.685, v_best_ld 10.956 m/s and v_stall 8.949 m/s for the baseline match. The first dsearch.py had a periodicity penalty that cancelled the gain, a completion test that failed by round-off for half of all periods, and a penalty that could turn negative; these were sent back for repair and the model's status stays calculated-and-unverified until the revised search is checked again.
  - id: K-005
    target:
      - env.sea_grow_tau_h
      - env.sea_decay_tau_h
      - env.turb_length_m
      - lit.swell_knee_height_m
    tier: T2
    method: hand_calc
    result: partial
    by: checker
    date: 2026-10-29
    detail: "A separate checker recomputed the wave-age and Drennan roughness (all four cases match to four digits), the swell-knee profile (matches exactly), and the turbulence normalization (u std 0.854 against 0.858, w/u 0.50, advection downwind). It found that the duration-limited growth is labelled SPM 1984 but uses U10 instead of the SPM adjusted wind UA, so Hs is about 40% low against the stated source; that the fully developed sea under the knee profile is 11% low; that the sea history grows faster than its own duration law and decays the swell in the step it is created; that the lateral turbulence intensity equals the longitudinal one; and that without a magnetometer the estimator uses the ground course as the heading, which hides the crosswind (9 m/s error), and that the vertical wind is never observed. The pitot bias passes straight into the wind estimate as derived. All of these were sent back for repair."
  - id: K-006
    target:
      - env.sea_grow_tau_h
    tier: T2
    method: refute
    result: fail
    by: checker
    date: 2026-10-29
    detail: "A separate checker opened the Coastal Engineering Manual (P71) and the Shore Protection Manual (P83) and checked the growth equations against the printed pages. The duration-to-fetch relation given to the implementer from memory (g t/u* = 77.23 X*^(2/3)) was wrong; 77.23 belongs to II-2-35, and the duration law is II-2-38, X* = 5.23e-3 (g t/u*)^(3/2). The code was corrected; at 15 m/s the sea now reaches 1.60, 2.70 and 4.53 m after 6, 12 and 24 h and the CEM limit of 7.88 m after about 50 h, matching the checker's computation from the printed equations."
  - id: K-007
    target:
      - spar.od_mm
      - spar.wall_mm
      - spar.mass_kg
      - spar.margin
      - spar.tip_deflection_ratio
      - dsopt.validation_u10_ms
      - form.baseline_2m.u10_min_travel_log
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-29
    detail: "A separate checker worked from commit 86d6689 only. Spar: an exhaustive search with the sourced mid values reproduced 13.0 mm by 0.75 mm, 0.0889 kg, margin 0.339, deflection ratio 0.1496; with the lower bounds of P54 the tube becomes 14 mm by 0.75 mm. Defects: the limiting-criterion label is wrong (stiffness limits, not stress); the tube is checked for fit only at the root although it runs the whole span, so a 13 mm tube fits only the inner quarter of the half span; the prose said the stress-only tube was 13 by 0.75. Optimizer: the equations, periodicity and Hermite-Simpson defects are correct (residual 1e-14); replaying the optimal controls in an independent Cartesian model closes the cycle to 1e-4 m and balances drag loss and wind gain; without the 0.3 m wingtip constraint the albatross case gives 8.566 m/s against Bower's 8.56, so the 11% gap is the wingtip constraint, which uses (b/2)|mu| instead of (b/2) sin|mu| cos gamma; converged values are about 9.46 and 11.81 m/s; the period is not robust; fixing z0 at its 8 m/s value overstates every minimum wind by about 7% (self-consistent baseline 11.07 m/s)."
  - id: K-008
    target:
      - dsopt.wave_floor_cases
      - dsopt.wave_steady_ride_cases
      - dsopt.wave_vertical_ratio_model
      - dsopt.shelter_albatross_l20_on_ms
      - env.shelter_onset_30m_u10_10
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-29
    detail: "A separate checker, told to refute, worked on the uncommitted wave mode of sim/dsopt.py and sim/out/dsopt_wave.json. (A) Swell cases at the u10 floor: replays of the optimal controls in its own inertial point-mass model (RK4, its own wind, matching sim.seawind to 2.5e-5 m/s) close after one cycle (height within 0.01 m) and balance drag against updraft and gust gain; ten open-loop cycles drift at most 0.8 J/kg; the cycles are unstable (per-cycle growth 1.06 to 2.45) and need feedback; heights between nodes stay at 1 m and the wingtip at 0.3 m. So the cycles are real solutions of the model. But the count is an optimizer artefact: the phase-slip integer m is fixed by the starting guess, and across-wave floor solutions rotated into the along-wave set-up reach the floor too, where the stored along values sit in local minima near 10 m/s; a steady-ride estimate puts at least 24 of 36 cases at the floor. The physical support is weak: the model's vertical wave wind is about 0.95 of the water orbital speed in calm air, while P64 measured about 0.3 m/s against about 0.5 m/s orbital (about 0.6); scaled to 0.6 the two replayed cases need 3.73 and 2.95 m/s of wind. At P64's own conditions the model gives about 0.09 m/s. (B) Steep-wave cases at the floor (a k 0.3, calm air): refuted; the 1.13 s cycle swings CL fully and the bank at up to 1154 deg/s, with 94% of the gain from the gust term, and linear potential flow is not credible at a k 0.3. (C) The claim that sheltering hardly acts because the onset slope is about 0.265: refuted; at the floor the gate is shut because the wave outruns the air, and where the gate is open (albatross, 20 m wave) sheltering lowered the minimum wind from 8.34 to 6.83 m/s, confirmed by a warm re-solve. Also: sim/patterns.py's wave-slope test is a stricter, different experiment (straight, steady, fixed height, with-wind swell only), not a contradiction; gamma(0) = 0 excludes the steady ride; there are no control-rate limits or n >= 0."
  - id: K-009
    target:
      - form.baseline_2m.u10_min_travel_log
      - form.albatross_3m.u10_min_travel_log_z003
      - dsopt.validation_u10_ms
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-29
    detail: "The checker of K-008 re-solved two cases of the corrected form study exactly as their meta calls did and reproduced the stored values to every printed digit (baseline 10.7254 m/s, T 5.876 s; albatross-like glider with z0 0.03 m 4.7577 m/s, T 6.534 s). Its own inertial RK4 replay closes after one cycle to 1e-4 m and 1e-4 m/s, balances drag loss against shear gain (54.60 and 47.85 J/kg per cycle) and drifts at most 0.01 m and 0.1 J/kg over ten cycles. The z0 of the corrected case equals the Charnock z0 at the found wind (2.4337e-4 m). The load factor stays between 0.97 and 3.78, bank rates are at most 101 deg/s and lift-coefficient rates about 2.3 to 2.5 per second. Refuted: the flat mode constrains the wingtip only at the nodes, and between nodes the geometric tip height falls to 0.268 and 0.255 m against 0.3 m; the midpoint rows of the wave mode would fix it. On the literature roughness: under P45's settings the optimizer gives 8.566 m/s for the Sachs albatross and 9.85 m/s under the candidate settings; the albatross-like glider with its lift-to-drag ratio lowered to 20 needs 10.62 m/s, so the minimum wind scales about as the inverse of the lift-to-drag ratio and hardly with wing loading; z0 0.03 m is about 660 times the Charnock value at 4.76 m/s, so that number is not a sea value."
  - id: K-010
    target:
      - env.coare35_charnock_slope
      - env.coare35_charnock_intercept
      - env.coare35_charnock_max
    tier: T2
    method: hand_calc
    by: checker
    result: pass
    date: 2026-10-29
    detail: "Before the COARE 3.5 option was written, a separate reader computed the neutral 10 m drag coefficient from the printed equations of P94 (eq. 11 and 13, slope 0.0017) for 4 to 14 m/s: 0.90, 0.98, 1.14, 1.32, 1.52 and 1.72 times 1e-3. The implementer received only those targets; the code gives 0.899, 0.974, 1.135, 1.321, 1.517 and 1.721, within 0.7% (sim/tests/test_seawind.py, test_coare35_drag). The form study rerun with the option (sim/out/dsopt_coare35.json) is not checked separately; it uses the optimizer checked in K-009."
  - id: K-011
    target:
      - ctrl.roll_pb2v
      - ctrl.actuator_tau_s
      - ctrl.actuator_delay_s
      - dsopt.sachs_coare_floor03_u10_ms
      - dsopt.sachs_coare_notip_floor01_u10_ms
      - mpc.margin_flat_truth_run_s
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-30
    detail: "A separate checker, told to refute, worked on design/flight-margins at 790b3f5. Actuators: its own continuous model (clip, delay, rate-limited lag) agrees with the code to 0.07 deg of bank and 0.0006 in cl, the limits k 2V/b and the cl rate are exact, and the planner rolls out through the same model; defects: the delay is rounded to whole steps and becomes 0 at a step of 0.1 s, the rollout does not apply the load-factor limit to the command, and its delay buffer starts from the last command only. Load limit: exact at 16 states; the negative side is limited only by cl_min, so n reaches -2.8 at 30 m/s for the baseline. Optimizer rate constraint: the bank rate stays within k 2V/b on dense replays (peak 1.001 of the limit); between nodes n exceeds its margin by up to 1.6%, V falls 0.9% under its floor and h to 1.951 m against 2 m. Clearance: the Sachs results reproduce (14.059 and 7.803 m/s) and the explanation holds (the unconstrained low turn banks 63 to 67 deg, which needs the centre at 1.56 m for a 0.05 m tip clearance; 63 other starts found nothing better); defects: the study ran without midpoints so the tip dipped to -0.014 m between nodes (rerun with midpoints: 14.15 and 7.81 m/s), the albatross-like glider's figures move by up to 0.8 m/s with the seed, and solve() accepted one non-physical cycle at the u10 bound whose dense replay ends 17 m low. Margin runs: two rows rerun exactly (300 s, tip contact really tested); only four runs with one seed, and the flown wind used Charnock while the library used COARE 3.5, the harder direction for the glider."
  - id: K-012
    target:
      - motor.baseline_calm_w
      - env.crest_stokes2_over_forristall_1e2
      - env.stability_l50_shear_factor
      - dsopt.wave4_floor_cases
      - dsopt.ge_baseline_on_u10_ms
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-30
    detail: "A separate checker, told to refute, worked on design/near-water at f00405d with its own image-method and vortex-sheet ground effect, its own second-order surface, its own Monin-Obukhov profile, and its own equations of motion and wave wind. Ground effect: the method matches Wieselsberger within 0.37% and the table nodes within 1e-5, and it is applied to the induced drag only with the normal height and the bank relative to the local slope; defect: near zero bank the table interpolation is low by up to 16% at small tip heights (a kink at zero bank that the reflected spline misses). Motor: 12.420 W without and 11.716 W with ground effect in calm air reproduced by hand; the calm cycle is level flight at the speed floor; defects: the track is 20 deg off downwind, not across the wind, and the 6 m/s value with ground effect came from a run at the iteration limit. Sea: second-order crests over six seeds are 1.000 +- 0.014 of Forristall's and linear ones 0.930; the stability factors reproduce at 9 m/s; the wind changes sign at the critical height only with the floor option, as a small jump. Wave study 4: two floor cycles over a 3 m swell re-solved exactly and replayed in the checker's own model close to 1e-4 m, keep the 2 m and 0.3 m margins and n within its limit, and draw their energy from the forward-face updraft (about 1.2 m/s at 2 m with P63, 0.65 m/s with P64's low bound, against a sink of 0.40 m/s); with P63's horizontal amplitude of 0.95 instead of 1.0 both still reach the floor. Document defects (rear-face low turns, how many albatross cycles sit at the period bound, the horizontal amplitude) were corrected."
  - id: K-013
    target:
      - mpc.burst_baseline_u11_normal_w
      - mpc.burst_baseline_u9_normal_w
      - mpc.burst_on_share_min
      - mpc.burst_on_share_max
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-30
    detail: "A separate checker, told to refute, re-ran four rows of the burst experiment with full logging (reproducing 8.77 W, 12.12 W, contact at 64.79 s, 16.01 W) and replayed them in its own point-mass model. The power accounting is right (8.768 W from the logged thrust and airspeed, a thrust lag of exactly 0.1 s), the energy balance closes to 0.005% of the drag loss, and the folded drag is applied; but the true wind used the fixed Charnock constant while the library uses COARE 3.5, and the smooth folded-drag switch keeps 65 to 73% of the folded drag in spells of little thrust. The thrust is a low trickle; the share of time it runs depends on the threshold (55 to 92% above 1% of the weight, over 97% above 0.1%), and its start timing on the climb holds for the baseline but not for the albatross-like glider. Refuted: that a heavier energy weight cannot save gradually (two of five costly rows finished at lower power) and that the horizon saw contact too late (the plans saw it 6 to 12 s ahead and kept the thrust off because of the cost and the sampling; a steady tenth of the weight would have saved the flight); and that the optimizer needs far less like for like (9.0 to 9.5 W against 12.1 W at 9 m/s, once the margins, ground effect and the speed along the track are matched). The document was corrected."
  - id: K-014
    target:
      - wing.best_u10_min_ms
      - wing.best_ld_max
      - wing.best_mass_kg
      - wing.heavy_skin_gain_min_ms
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-30
    detail: "A separate checker, told to refute, worked on design/wing-sizing at 63b237b with its own polar, mass arithmetic, spar derivation and Cartesian point-mass model. The drag polar matches the formulas at 20 points and the dynamics use it (replay closes to 1e-4 m); L/D 27.5 is right at the cycle-mean Reynolds number but 25.1 at the design's own glide speed; on the Bubble Dancer geometry the polar is 4 to 6% pessimistic against Drela's calculation, and measured 3 m sailplanes glide at 18 to 25. The mass arithmetic and the fixed point reproduce (1.872 kg), and the spar factor 2/(9 pi) is right for a uniform-load moment shape and conservative for an elliptic one, but the spar is under 1% of the mass. The best design's 13.22 m/s re-solves bit-identically and its replay balances the energy and keeps the margins (heights 3 mm under 2 m and n 0.5% over between nodes). Refuted: that slender wings lose because of their chord (at equal mass, with ballast, aspect ratios 20 and 25 soar from 12.99 and 13.10 m/s, better than aspect ratio 12; they rank lower because they are lighter) and that a heavier skin helps only through the Reynolds number (half of it is the rate limits loosening at higher speed). Also: single-start solves move by up to 0.9 m/s with more starts, the Nita and Scholz taper offset is omitted (e 0.973 against 0.977), and the body drag area of 10 cm^2 may be low. The document was corrected."
  - id: K-015
    target:
      - mpc.motorlib_baseline_u9_w
      - mpc.motorlib_albatross_calm_w
      - mpc.reflex_baseline_u9_count
      - mpc.motorlib_wave_ended
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-30
    detail: "A separate checker, told to refute, worked on design/batch-env-wing-motor at c38add0 with its own point-mass model. Library: the baseline's 9 m/s motor cycle and the albatross-like glider's calm cycle replay and close, keep their margins (several exactly at the limit) and need 10.876 W and 20.928 W against 10.871 and 20.928 stored; but the calm cycle flies 49 deg off its course. Flat sea, reflex off: 180 s at 15.283 W and 0.447 Wh/km against the optimizer's 10.87 W and 0.551 Wh/km, COARE 3.5 confirmed; the fold is exercised only in the reflex-on run, where it follows the commanded state exactly; the per-kilometre ratio ranges 0.81 to 2.2 across rows. Reflex: 31 false stall firings confirmed at the prediction's end while flying well above stall, in reflex 18% of the time, a climb to 115 m and 4.26 to 4.42 times the energy, in two of nine flat rows; a threshold of 0.95 stall speeds removes them and still rescues four constructed dives; the override zooms the aircraft to 0.44 stall speeds and the stall test ignores the load factor. Waves: 6 of 16 runs ended early, not 8, 4 of them with the reflex on against 2 off, one by full thrust past the vertical. The document was corrected."
  - id: K-016
    target:
      - wing.best_u10_min_ms
      - wing.best_mass_kg
      - wing.best_wing_loading_npm2
      - wing.body_cda_min_m2
      - wing.body_cda_max_m2
      - wing.h180_ar20_sd7037_ms
      - wing.front1_c9_w
      - wing.c9_chi20_min_w
      - wing.c9_chi20_max_w
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-30
    detail: "A separate checker, told to refute, worked on design/wing-loading (855b082) with its own steady-flight power from the polar coefficients, mass arithmetic, body drag build-up, the Nita and Scholz equations read from the paper, and its own point-mass replay. Confirmed: the soaring minima re-solve from other starts at the record's Reynolds numbers (AR 20 at the mass limit 12.870, AR 16 at the limit 13.009, AR 16 unballasted 15.308 against 15.224); the replays close and balance the energy (wind gain equals drag loss to 1e-7), with the load factor up to 0.8% over its margin and the speed 0.1% under its floor between nodes. Also confirmed: the masses, wing loadings and ballast to the limit to four decimals, with the ballast in the spar load and the mass limit binding; the body drag areas of 19.8 to 39.2 cm2 (tails 42 to 68% of the parts, the horizontal tail at 37k to 78k Reynolds number, below the fit); e 0.977 at aspect ratio 12; the solve_a fix on stubbed passes; and h(180) of -6.32 m/s for the best design, with 8.3 m/s of cross-track velocity left free. A 25% smaller tail lowers the minima by 0.15 to 0.24 m/s and half the tail by 0.33, more than the spread of the three best. Refuted: the motor power at 9 m/s is not bounded by the steady level flight. That flight was evaluated with the polar at the soaring cycle's Reynolds number; at its own Reynolds number its power equals the optimizer's to four digits for all 22 designs. The optimizer stops at that start after one iteration, and from random starts it reaches the same level flight at the speed floor. So the front's 20 deg powers and energies per kilometre were 11 to 14% low (27.0 against 30.3 W for the best design), and the ratio wing.solver_over_steady_* was an artefact. The document was corrected."
  - id: K-017
    target:
      - nav.albatross_upwind_support_max_ms
      - nav.no_progress_within_deg_min
      - nav.albatross_hull_min_downwind_u16_ms
      - nav.albatross_steady_upwind_u16_ms
      - nav.albatross_steady_upwind_u16_j_per_m
      - nav.run5_albatross_u16_upwind_energy_wh
      - nav.run5_albatross_u16_upwind_height_median_m
      - nav.run10_albatross_u13_across_energy_wh
      - nav.run5_albatross_u16_downwind_counted
      - nav.run5_albatross_u16_downwind_motor_share
      - nav.thrust_bias_raw_sustained_applied_pct
    tier: T2
    method: independent_model
    result: partial
    by: checker
    date: 2026-10-31
    detail: "A separate checker, told to refute, worked in two rounds with its own code: the uncommitted state on 6404d4c, then c861395. Round 1 confirmed the support reading of the polar (consistent at 13 to 20 m/s with every cycle on the downwind side, the 120 deg cycle at 16 m/s flying 21.63 m/s 54 deg off its course, every library soaring cycle drifting downwind, so no soaring mix holds a line across the wind), the steady leg (8.92 m/s at 10.757 J/m, no limit binding) and the library changes (calm entries on course, own replays closing). It refuted: the albatross 11 m/s row as a support function; the no-progress range; the wing study's upwind VMG; powered legs said to fly at 10 m that flew at median heights of 16 to 35 m, two above R-12, which explained the 82 to 92 %; a downwind run on soaring cycles that ended on a powered leg with two loops, 3.9 m/s against a stall speed of 10.1 m/s and a 0.18 m wingtip, logged as arrived; the raw thrust update as unbiased (the one-sided held samples and the clip of the nominal); and many prose numbers (N-01). All of these were corrected. Round 2 reruns albatross 16 m/s upwind 5 km, 13 m/s across 10 km and 16 m/s downwind 5 km, all identical to the record. Median heights are 10.75 and 10.01 m, and the energy per metre is 1.024 and 0.999 times the steady leg's at 0.94 to 0.97 of its speed. Downwind it stays on soaring cycles with no loop or stall, airspeed at least 12.1 m/s, wingtip 0.51 m, height 1.81 to 29.83 m, motor share 0.048. counts_as_arrived matches a full-resolution recomputation. The new raw update keeps the signed nominal near zero (own test +0.02 and +0.69 %) while the applied thrust stays near 2 % of the weight when thrust does not matter. The generated keys and table match the runs, tdr check passes, and 311 tests pass. Left: sim/polar.py still computes an upwind VMG as progress times a cosine, the remaining motor share is called real without a test, three code comments still say unbiased, and one interval in the prose is wrong. The four remaining items were corrected."
