    url: https://doi.org/10.1002/qj.49708135027
    license: unknown
    read: not_read
    note: Origin of the Charnock relation z0 = a u*^2/g used in sim/seawind.py. Not read in this project; the formulas are implemented from textbook knowledge and are to be verified (Q-008).
  - id: P39
    class: P
    title: A proposed spectral form for fully developed wind seas based on the similarity theory of S. A. Kitaigorodskii, W. J. Pierson and L. Moskowitz, Journal of Geophysical Research 69, 1964
    url: https://doi.org/10.1029/JZ069i024p05181
    license: unknown
    read: not_read
