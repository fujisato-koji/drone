    note: Charnock coefficient 0.011 and the neutral log profile over the sea. Not read in this project; the formulas are implemented from textbook knowledge and are to be verified (Q-008).
  - id: P42
    class: P
    title: How do albatrosses fly around the world without flapping their wings?, P. L. Richardson, Progress in Oceanography 88, 2011
    url: https://doi.org/10.1016/j.pocean.2010.08.001
    license: unknown
    read: full
    retrieved: 2026-10-29
    note: Rayleigh cycle minimum wind difference 3.4 to 3.6 m/s for an albatross with L/D 21; log profile form; quotes Sachs 2005 minimum V10 of about 9 m/s.
  - id: P43
    class: P
    title: Upwind dynamic soaring of albatrosses and UAVs, P. L. Richardson, Progress in Oceanography, 2015
    url: https://doi.org/10.1016/j.pocean.2014.11.002
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: 3.6 m/s as the minimum wind for sustained upwind soaring; UAV maximum airspeed about 9.5 times the upper-layer wind.
  - id: P44
    class: P
    title: Optimal dynamic soaring consists of successive shallow arcs, G. D. Bousquet, M. S. Triantafyllou, J.-J. E. Slotine, Journal of the Royal Society Interface 14, 2017
    url: https://doi.org/10.1098/rsif.2017.0496
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: Shear layer 1 to 3 m thick; turn angles of 54 to 78 degrees from GPS; birds use 25 to 50% of U10.
  - id: P45
    class: P
    title: Boundary layer dynamic soaring for autonomous aircraft, G. C. Bower, PhD thesis, Stanford University, 2011
    url: https://purl.stanford.edu/hp877by7094
    license: "CC BY-NC 3.0"
    read: partial
    retrieved: 2026-10-29
    note: "Minimum reference wind at 10 m: 8.56 m/s for the albatross model (L/D 20) and 8.01 m/s for the 2 kg Mariner design (L/D 25, 70.6 N/m2, AR 15); large span, low cd0 and low mass help, span above 2.5 m gives little more. The roughness z0 = 0.03 m is chosen to match previous researchers (Sachs 2005) and as a reasonable value for a rough sea, citing Stull for values from 1e-4 m for calm water to 0.03 m for cut grass or a very rough sea; his own wave model gives 0.0023 m at U10 11.28 m/s (read by a second reader on 2026-10-29). His optimizer limits the roll rate to 90 deg/s, the lift-coefficient rate to 0.5 per second and the bank to 60 deg, and finds these constraints of minimal importance so long as they are larger than about 0.5 per second and 60 deg/s (sections 5.1 and 5.4 to 5.6)."
  - id: P46
    class: P
    title: "Flying at no mechanical energy cost: disclosing the secret of wandering albatrosses, G. Sachs et al., PLoS ONE 7(9), 2012"
    url: https://doi.org/10.1371/journal.pone.0041449
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: Cycle about 15 s, heights 0 to 15 m, ground speed peaks about 30 m/s at U10 11.3 m/s.
  - id: P47
    class: P
    title: Experimental verification of dynamic soaring in albatrosses, G. Sachs et al., Journal of Experimental Biology 216, 2013
    url: https://doi.org/10.1242/jeb.085209
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: "Cycle about 10 s, heights 0 to 15 m, propulsive force peak about 1.2 times the weight. The wind is taken from QuikSCAT at 10 m with a logarithmic model; the average effective wind gradient was about 0.1 1/s against about 0.7 1/s required, so the existing gradient is far too small (partial read by a second reader on 2026-10-29). On ground effect (p. 4228): it cannot increase the total energy because it merely reduces the drag, so it plays no role in the energy gain; the induced drag factor falls by about 10% at a height of a semispan, and a high bank reduces the effect."
  - id: P48
    class: P
    title: Towards robust optimization-based autonomous dynamic soaring with a fixed-wing UAV, M. Harms et al., arXiv 2512.06610, 2025
    url: https://arxiv.org/abs/2512.06610
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: "EasyGlider 1.8 m, 1.35 kg, 0.4 m2; drag polar CD = 0.0172 - 0.0943 CL + 0.358 CL^2 (from the v2 Table II, CD(alpha) = 0.029 + 0.378 alpha + 1.984 alpha^2 and CL = 0.356 + 2.354 alpha; an identified control model, not a physical polar); tests in 8 to 12 m/s wind. Its optimizer bounds the bank change by 2.0 rad per second (Table I) and has no bound on the lift-coefficient rate."
  - id: P49
    class: P
    title: "Design of small hand-launched solar-powered UAVs: from concept study to a multi-day world endurance record flight, P. Oettershagen et al., Journal of Field Robotics, 2017"
    url: https://doi.org/10.1002/rob.21717
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: "AtlantikSolar avionics 6 W including Iridium; SunPower E60 23.7%, 590 g/m2; design load factor 4 with safety factor 1.8. Second reader on 2026-10-30: motor efficiency about 80.6% in level flight, minimum output power 39.7 W at 8.3 m/s including about 6 W of avionics, combined propulsion efficiency 0.62 assumed from Noth."
