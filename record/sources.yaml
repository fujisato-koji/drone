  - id: P42
    class: P
    title: How do albatrosses fly around the world without flapping their wings?, P. L. Richardson, Progress in Oceanography 88, 2011
    url: https://doi.org/10.1016/j.pocean.2010.08.001
    license: unknown
    read: full
    retrieved: 2026-10-29
    note: Rayleigh cycle minimum wind difference 3.4 to 3.6 m/s for an albatross with L/D 21; log profile form; quotes Sachs 2005 minimum V10 of about 9 m/s.
  - id: P43
    class: P
    title: Upwind dynamic soaring of albatrosses and UAVs, P. L. Richardson, Progress in Oceanography, 2015
    url: https://doi.org/10.1016/j.pocean.2014.11.002
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: 3.6 m/s as the minimum wind for sustained upwind soaring; UAV maximum airspeed about 9.5 times the upper-layer wind.
  - id: P44
    class: P
    title: Optimal dynamic soaring consists of successive shallow arcs, G. D. Bousquet, M. S. Triantafyllou, J.-J. E. Slotine, Journal of the Royal Society Interface 14, 2017
    url: https://doi.org/10.1098/rsif.2017.0496
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: Shear layer 1 to 3 m thick; turn angles of 54 to 78 degrees from GPS; birds use 25 to 50% of U10.
  - id: P45
    class: P
    title: Boundary layer dynamic soaring for autonomous aircraft, G. C. Bower, PhD thesis, Stanford University, 2011
    url: https://purl.stanford.edu/hp877by7094
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: "Minimum reference wind at 10 m: 8.56 m/s for the albatross model (L/D 20) and 8.01 m/s for the 2 kg Mariner design (L/D 25, 70.6 N/m2, AR 15); large span, low cd0 and low mass help, span above 2.5 m gives little more."
  - id: P46
    class: P
    title: "Flying at no mechanical energy cost: disclosing the secret of wandering albatrosses, G. Sachs et al., PLoS ONE 7(9), 2012"
    url: https://doi.org/10.1371/journal.pone.0041449
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: Cycle about 15 s, heights 0 to 15 m, ground speed peaks about 30 m/s at U10 11.3 m/s.
  - id: P47
    class: P
    title: Experimental verification of dynamic soaring in albatrosses, G. Sachs et al., Journal of Experimental Biology 216, 2013
    url: https://doi.org/10.1242/jeb.085209
    license: unknown
    read: partial
    retrieved: 2026-10-29
    note: Cycle about 10 s, heights 0 to 15 m, propulsive force peak about 1.2 times the weight.
