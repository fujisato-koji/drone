  - id: D-001
    date: 2026-10-25
    by: owner
    what: Design and build a drone as a personal project, aiming for it to be certifiable in Japan.
    touches:
      - Q-001
      - Q-002
  - id: D-002
    date: 2026-10-25
    by: owner
    what: Keep the record public from the start, and name the repository drone until the purpose of the drone is decided.
    touches:
      - Q-002
  - id: D-003
    date: 2026-10-25
    by: owner
    what: Make a drone that is cheap to build and can obtain type certification (the owner wrote 認定, approval, which was read as 認証, certification).
    touches:
      - Q-001
      - Q-002
  - id: D-004
    date: 2026-10-25
    by: owner
    what: Fly it beyond visual line of sight over places where people are.
    touches:
      - Q-001
  - id: D-005
    date: 2026-10-25
    by: owner
    what: Spend at most 300,000 yen on building and certification.
    touches:
      - D-001
  - id: D-006
    date: 2026-10-25
    by: owner
    what: The owner does not fix the takeoff weight first, and decides it after seeing a proposal derived from the purpose.
    touches:
      - Q-002
  - id: D-007
    date: 2026-10-26
    by: owner
    what: Write the record, the docs, and commit messages in English, and talk with the owner in Japanese.
    touches:
      - D-002
  - id: D-008
    date: 2026-10-29
    by: owner
    what: Design a drone that stays aloft over the sea for a year with dynamic soaring as its core.
    touches:
      - D-001
      - D-003
      - D-004
      - Q-002
      - Q-004
  - id: D-009
    date: 2026-10-29
    by: owner
    what: The drone goes on its own to a place it is told, over the sea and at least 10 km away, and sends photos or data from there, preferably from the spot; the long aim is to circle the globe or to photograph Antarctica.
    touches:
      - Q-002
  - id: D-010
    date: 2026-10-29
    by: owner
    what: Build the computation environment first, starting with a model of the sea surface and the wind above it that can be viewed in three.js, and design the aircraft in the order requirements, form, structural design, structural model.
    touches:
      - D-008
