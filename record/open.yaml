kind: open
schema: 1
items:
  - id: Q-001
    kind: question
    text: "Which certification to aim for: type certification or aircraft certification, and class 1 or class 2. Settle it from primary sources of the Civil Aviation Bureau (MLIT), and record what each route asks of an individual builder."
    waits_for: assistant
    affects:
      - D-001
    opened: 2026-10-25
    raised_by: owner
    phase: design
    closed: 2026-10-26
    closed_by: K-001
  - id: Q-002
    kind: question
    text: What the drone is for (its mission, payload, and where and how it flies). Ask the questions that can rule a form out before comparing any form.
    waits_for: owner
    affects:
      - D-001
      - D-002
    opened: 2026-10-25
    raised_by: owner
    phase: design
    closed: 2026-10-29
    closed_by: D-009
  - id: Q-003
    kind: question
    text: Does the budget of D-005 include the fees paid to the State for inspection? If it does, every certification route uses most of the budget on fees alone (cert.fee_type_class2_under4kg, cert.fee_aircraft_class2_untyped_under4kg).
    waits_for: owner
    affects:
      - D-005
    opened: 2026-10-26
    raised_by: assistant
    phase: design
    closed: 2026-10-29
    closed_by: D-012
  - id: Q-004
    kind: question
    text: Keep aiming for class 1 type certification (Level 4), or make the first type a class 2 type under cert.self_confirm_weight and take class 1 as the next step?
    waits_for: owner
    affects:
      - D-003
      - D-004
    opened: 2026-10-26
    raised_by: assistant
    phase: design
    closed: 2026-10-29
    closed_by: D-012
  - id: Q-005
    kind: question
    text: The uniformity standard of type certification does not allow a split in which the designer, maker, inspector, and person responsible for a component are all the same single person with nobody else (P7 p244). Who will take at least one role (for example, inspection) and the independent audit, which may be held together with other roles?
    waits_for: owner
    affects:
      - D-003
    opened: 2026-10-26
    raised_by: assistant
    phase: design
    closed: 2026-10-29
    closed_by: D-012
  - id: Q-006
    kind: question
    text: Find third party liability insurance that an individual can buy for a self-built aircraft flown at Level 3.5. The hobby policy covers hobby flights only and excludes work and research (M3), the business policy is for corporations and sole proprietors and for industrial aircraft with a sale price (M4), and another product excludes self-built aircraft (M5).
    waits_for: assistant
    affects:
      - D-001
    opened: 2026-10-26
    raised_by: assistant
    phase: design
  - id: Q-007
    kind: question
    text: "Which rules apply to a year-long unmanned flight over the sea (night and beyond visual line of sight permissions inside Japanese airspace, the rules beyond it), and what the drone must carry to be legal. Whether the certification aim still applies was settled by the owner in D-012. The owner question that depends on its answer waits for it first (Q-025)."
    waits_for: assistant
    affects:
      - D-008
      - D-012
      - R-11
    opened: 2026-10-29
    raised_by: assistant
    phase: design
    blocks: design_build
  - id: Q-008
    kind: question
    text: "Verify the constants and formulas of the sea and wind model (sim/seawind.py and sim/sea_history.py), one constant at a time, against primary sources. env.karman, env.charnock and env.air_kinematic_viscosity: read P38 and P41, and compare env.charnock with lit.charnock_coare35_at_10ms (P66); settled when the values are adopted from a read source or the difference is explained. Roughness (2026-10-29): the open sea's drag was read in P94 to P96 and env.charnock lies inside their spread; COARE 3.5 (P94) is the option to use for sea values, and the literature's z0 of 0.03 m is a land value (P99), so the roughness question is settled for neutral air (docs/02-form.md#sea-roughness); stability and swell remain as Q-061. env.jonswap_gamma: read P40. env.pm_hs_coefficient and env.pm_peak_coefficient: read P39. env.sea_decay_tau_h: settled by a source for the decay time of swell over the open ocean, or by recording it as a model choice with its effect on the shear. env.breaking_slope_limit: settled by a source for the slope at which a wave breaks. env.turb_length_m: settled by a source for the turbulence length scale over the sea; until then env.turb_gust_factor_check against lit.gust_factor_3s_10min_sea (P68) is a consistency check only. env.turb_v_ratio and env.turb_w_ratio: read P72 (IEC 61400-1), which is not read yet. env.shelter_ramp_ratio and env.shelter_decay_kz: the crude sheltering behind steep crests; the onset steepness and the deficit are sourced (P89, P92, P93), but how the separated share grows with slope and the height the deficit reaches are not stated by any source read (P90 and P91 support the height only indirectly). env.sea_grow_tau_h is not used by the code any more (the equivalent-duration growth law of P71 replaced it, K-006); it stays in the record because K-005 targets it, until the standard has a withdrawn status. The wave-coherent perturbation is a crude potential-flow model and its size near the surface is unverified. Treat the growth law and the wave figures shown to the owner as provisional until the check of the growth law against the printed pages passes."
    waits_for: assistant
    affects:
      - env.karman
      - env.charnock
      - env.air_kinematic_viscosity
      - env.jonswap_gamma
      - env.pm_hs_coefficient
      - env.pm_peak_coefficient
      - env.sea_grow_tau_h
      - env.sea_decay_tau_h
      - env.breaking_slope_limit
      - env.turb_length_m
      - env.turb_v_ratio
      - env.turb_w_ratio
      - env.shelter_ramp_ratio
      - env.shelter_decay_kz
    opened: 2026-10-29
    raised_by: assistant
    phase: design
    blocks: design_build
  - id: Q-009
    kind: question
    text: "Settle the assumed design points of the dynamic soaring drone from the albatross and demonstrator literature and from the simulation. ds.mass_max_kg and ds.span_max_m: settled by the form comparison in docs/02-form.md#form-comparison and by what one person can carry, which is the owner's decision. ds.avionics_power_w: settled by the power budget of Q-012. ds.n_limit and ds.safety_factor: settled by loads from the simulation, with lit.cs22_limit_load_factor and lit.atlantiksolar_load_factor as references. ds.survival_hs_m: settled by the sea statistics of P61 and P62 and the water tests of R-05. ds.altitude_band_max_m and ds.clearance_min_m: settled by the simulation of the shear layer and by the owner on safe height (Q-013). ds.photo_bytes waits for the owner's choice of what the image is for. The owner confirmed R-01 to R-12 with these numbers still assumed (D-011), so each change of a value that a design point cites is for the owner to decide. Update 2026-10-31 (docs/02-form.md#wind-climate): in the Southern Ocean the significant wave height is at or above ds.survival_hs_m in climate.so_weak_dsmin_hs_survival_share of the hours below ds.min_u10_ms, when R-05 puts the drone on the water, and in climate.so_year_hs_survival_share of all hours; in the North Pacific climate.np_weak_dsmin_hs_survival_share and climate.np_year_hs_survival_share, in the home area climate.home_weak_dsmin_hs_survival_share and climate.home_year_hs_survival_share."
    waits_for: "assistant, then owner"
    affects:
      - R-02
      - R-04
      - R-05
      - R-07
      - R-08
      - R-09
      - R-12
      - ds.photo_bytes
      - ds.mass_max_kg
      - ds.span_max_m
      - ds.avionics_power_w
      - ds.n_limit
      - ds.safety_factor
      - ds.survival_hs_m
      - ds.altitude_band_max_m
      - ds.clearance_min_m
    opened: 2026-10-29
    raised_by: assistant
    phase: design
    blocks: design_build
  - id: Q-010
    kind: finding
    text: With the pultruded carbon values of P54 the lightest spar that meets the stress criterion deflects 0.168 of the half span at limit load, above the 0.15 practice; the sizing routine has no stiffness criterion, and roll-wrapped or prepreg tubes (higher modulus) are not yet sourced. Add a deflection limit to the sizing and source a stiffer tube before the next pass.
    waits_for: assistant
    affects:
      - spar.tip_deflection_ratio
      - spar.od_mm
    raised_by: assistant
    phase: design
    opened: 2026-10-29
    blocks: design_build
  - id: Q-011
    kind: finding
    text: "The sea and wind model has no turbulence, keeps the log profile under swell although measurements show a wind maximum or knee at 5 to 10 m with a nearly constant wind above (P65), and decays the wave-induced perturbation as exp(-k z) where measurements give exp(-0.77 k z) and exp(-0.62 k z) (P63). Swell dominates about 90% of the time in the Pacific (P62), so the shear available for soaring may be overestimated above the knee. Add a turbulence model, a swell-knee profile option, and measured decay rates, and run the form study with both profiles."
    waits_for: assistant
    affects:
      - R-02
      - R-12
      - env.charnock
    raised_by: assistant
    phase: design
    opened: 2026-10-29
  - id: Q-012
    kind: finding
    text: "The baseline's wing carries an average of patterns.solar_avg_baseline_w of solar power against ds.avionics_power_w of avionics, so R-08 cannot be met as the design point stands; a year aloft needs average avionics power cut to a fraction of a watt by sleeping between tasks, more solar area, or both, and the darkest design day (lit.insolation_50s_june_kwh_m2_day) makes it harder. Settle the power budget before the form is chosen. Update 2026-10-31 (docs/02-form.md#wind-climate): on the darkest design day the best wing would yield climate.solar_day_best_so_wh in the Southern Ocean and climate.solar_day_best_home_wh in the home area against climate.avionics_day_wh for the avionics (with the pattern study's cell assumptions), and floating through the 99th percentile spell below wing.best_u10_min_ms takes climate.so_best_float_p99_wh and climate.home_best_float_p99_wh with no solar credited. Update 2026-10-31 (docs/02-form.md#sea-estimation): the sensors that let the planner fly over swell on its own estimate of the sea draw est.set_tips_rtk_power_w (tip radars and RTK, est.set_tips_rtk_mass_g) to est.set_radar_tips_fwd_rtk_power_w (with the radar altimeter at the fuselage and the forward radar) including the GNSS receiver and IMU (sense.gnss_power_w, sense.imu_power_w), which ds.avionics_power_w may already hold; the tip radars' power is the bare chip's only, without the microcontroller that runs them; the radar altimeter alone takes sense.radar_power_w and the forward radar sense.fwd_power_w (assumed). They need to run only while the drone flies low over waves, so their share of the daily budget depends on how long it does; the mass and power of every set and sensor are keys of that section."
    waits_for: assistant
    affects:
      - R-08
      - ds.avionics_power_w
    raised_by: assistant
    phase: design
    opened: 2026-10-29
    blocks: design_build
  - id: Q-013
    kind: finding
    text: "Wave-slope soaring is sustainable for most candidates only near the surface (the analysis put its floor at patterns.wave_slope_floor_m) and only over swell of about 8 s period, below the clearance of R-12 (ds.clearance_min_m); either R-12 gets a lower floor for wave-slope flight, which is the owner's decision, or wave-slope soaring is not a usable pattern for these sizes. Rerun the analysis with the floor at ds.clearance_min_m. Update 2026-10-31 (docs/02-form.md#wind-climate): swell of 3 m or more is present in climate.so_weak_dsmin_swell3_share of the hours below ds.min_u10_ms in the Southern Ocean, climate.np_weak_dsmin_swell3_share in the North Pacific and climate.home_weak_dsmin_swell3_share in the home area, at a median peak period of climate.so_weak_dsmin_tp_s, climate.np_weak_dsmin_tp_s and climate.home_weak_dsmin_tp_s where it is 2 m or more."
    waits_for: assistant
    affects:
      - R-12
    raised_by: assistant
    phase: design
    opened: 2026-10-29
    blocks: design_build
  - id: Q-014
