  - id: Q-017
    kind: finding
    text: "K-004 sent back three defects of the first sim/dsearch.py: a periodicity penalty that cancelled the energy gain, a completion test that failed by round-off for half of all periods, and a penalty that could turn negative. Commit 86d6689 repaired the search (sim/dsearch.py) and added the collocation optimizer (sim/dsopt.py). No check has looked at the repair, so K-004 stays partial and the results of both searches rest on unverified code. A re-check by a separate checker (method refute, independent_model or hand_calc) is owed."
    waits_for: assistant
    affects:
      - K-004
      - R-02
      - R-12
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-018
    kind: finding
    text: "K-005 sent back the wave growth law, which was labelled SPM 1984 but used U10 instead of the adjusted wind, and the fully developed sea under the knee profile, which was 11 percent low. Commit 86d6689 replaced the growth law with the equivalent-duration law of P71 (K-006 then corrected a wrong constant, checked against the printed pages) and took the friction velocity of the log profile under the knee profile. A passing re-check of the repaired law and of the knee-profile limit is owed, and env.sea_grow_tau_h, the target of K-005 and K-006, is no longer used by the code."
    waits_for: assistant
    affects:
      - K-005
      - K-006
      - env.sea_grow_tau_h
      - env.cem_hm0_coeff
      - env.cem_duration_coeff
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-019
    kind: finding
    text: "K-005 found that the sea history grew faster than its own duration law and decayed the swell in the step in which it was created. Commit 86d6689 changed sim/sea_history.py to an equivalent-duration scheme in which the swell decays on its energy and not in its own step. No check has looked at the repair, and a re-check is owed."
    waits_for: assistant
    affects:
      - K-005
      - env.sea_decay_tau_h
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-020
    kind: finding
    text: "K-005 found that the lateral turbulence intensity equalled the longitudinal one. Commit 86d6689 set it to env.turb_v_ratio times the longitudinal intensity, with env.turb_w_ratio for the vertical, both assumed on P72 which is not read. A re-check is owed."
    waits_for: assistant
    affects:
      - K-005
      - env.turb_v_ratio
      - env.turb_w_ratio
      - env.turb_length_m
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-021
    kind: finding
    text: "K-005 found that, without a magnetometer, the estimator used the ground course as the heading, which hid the crosswind (9 m/s error), and that the vertical wind is never observed. Commit 86d6689 replaced the ground-course heading with an airspeed-magnitude wind fit in sim/estimator.py; the vertical wind is still not observed. A re-check of the repair is owed."
    waits_for: assistant
    affects:
      - K-005
      - R-03
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-022
    kind: finding
    text: "K-005 found that the pitot bias passes straight into the wind estimate. Commit 86d6689 added a pitot scale estimate and a validity flag to the estimator (sim/estimator.py). A re-check of the repair is owed."
    waits_for: assistant
    affects:
      - K-005
      - R-03
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-023
    kind: finding
    text: "K-003 lists spar.od_mm, spar.wall_mm, spar.margin and spar.tip_deflection_ratio as passed, but it checked a first pass with other numbers (assumed carbon values, record at c92d9ac). Those four keys now hold different numbers, sized with the pultruded values of P54 and the deflection limit of D-014, and no check has looked at them. A separate check of the current spar (re-check K-007) is being made by another agent; until it is recorded, K-003 must not be read as a check of the current numbers."
    waits_for: assistant
    affects:
      - K-003
      - spar.od_mm
      - spar.wall_mm
      - spar.margin
      - spar.tip_deflection_ratio
      - spar.mass_kg
    opened: 2026-10-29
    raised_by: checker
    phase: design
  - id: Q-024
    kind: finding
    text: "The collocation optimizer (docs/02-form.md#form-comparison) found that no candidate form sustains a travelling cycle at ds.min_u10_ms. The lowest minimum wind is form.albatross_3m.u10_min_travel_log, which is also the candidate with the highest wing loading of the six, and the validation against P45 gave dsopt.validation_u10_ms where P45 gives lit.min_u10_albatross_ms. With the corrections of K-007 the gap narrowed, and under the roughness the soaring literature uses (z0 = 0.03 m) the baseline, the albatross-like glider, the sealed hull and the small demonstrator all come below ds.min_u10_ms (form.<candidate>.u10_min_travel_log_z003), so the answer first depended on which roughness the open sea has (Q-008); that roughness turned out to be a land value, and the open sea in neutral air has about half its shear (docs/02-form.md#sea-roughness), so on a flat sea in neutral air the gap stands, and the routes left are a higher lift-to-drag ratio, the waves (Q-058) and the extra shear under swell and in stable air (Q-061). K-009 found that the minimum wind scales about as the inverse of the lift-to-drag ratio and hardly with the wing loading, so the lever is the lift-to-drag ratio, which is assumed for every candidate (Q-014). After that, the owner decides which to change, with the current and the proposed design side by side: lower the wing loading (a lighter or larger wing, against ds.mass_max_kg and ds.span_max_m), change the form, or raise the design wind of R-02 (ds.min_u10_ms). Update 2026-10-30: with measured airfoil data, a body drag area and the control margins, no wing soars below about wing.best_u10_min_ms on a flat sea in neutral air (docs/02-form.md#wing-sizing)."
    waits_for: "assistant, then owner"
    affects:
      - R-02
      - ds.min_u10_ms
      - ds.mass_max_kg
      - ds.span_max_m
      - form.albatross_3m.u10_min_travel_log
    opened: 2026-10-29
    raised_by: assistant
    phase: design
  - id: Q-025
    kind: question
    text: "No hazards are recorded, so the gate check passes without any. Decide whether to record the following hazards, each with phases, at_risk and controls, and the derived requirements (status awaiting) that control them. Hazards: vessels and small craft (strike, or while floating); manned low-flying aircraft; people at hand launch and return; cells or a wreck washing ashore; cell fire after sea water, in charging, storage and shipping; carbon dust, epoxy and hot-wire fumes while building; recovery by boat; fishing gear fouled by a wreck; flyaway over land, ports or across a border; radio misuse or interference. Derived requirements: conspicuity, geofence or flight termination, identification for a finder, an end-of-life and recovery plan, radio conformity. R-06 would be cited only for sea water reaching the cells, and R-07 and R-12 only where they control. Wildlife and photo privacy stay under Q-007 and R-11 unless the owner widens the scope. A decision that lists the hazards is needed before any T3 change to the design points, and before the form is chosen, since strike energy can bound mass and span. Waits for Q-007 first (rules on lights, identification and radio), then the owner."
    waits_for: "Q-007, then owner"
    affects:
      - R-06
      - R-07
      - R-11
      - R-12
      - D-013
      - Q-007
    opened: 2026-10-29
    raised_by: assistant
    phase: design
  - id: Q-026
    kind: question
    text: "Four design points carry numbers inside their text: R-03 (within 1 km), R-04 (within one hour), R-06 (immersion to 1 m for 24 h), R-10 (significant wave height 2 m). Decide whether to move them into keys without changing any number, so that each has a status and a basis. Proposed: ds.waypoint_tolerance_km 1, ds.photo_latency_h 1, ds.immersion_depth_m 1, ds.immersion_duration_h 24, ds.touchdown_hs_m 2, all assumed under Q-009, and cite ds.endurance_days where R-06 says a year. The current and the proposed texts are to be shown side by side when this is put to the owner (T3, in a decision that lists the hazards touched). Until then Q-009 does not list these keys."
    waits_for: owner
    affects:
      - R-03
      - R-04
      - R-06
      - R-10
      - Q-009
    opened: 2026-10-29
    raised_by: assistant
    phase: design
  - id: Q-027
    kind: question
    text: "The questions that can rule a form out are only partly answered. Open: when the drone must be ready and how often it is used; the builder's skills, tools and help; which materials and services can be had, at what price; the end of life or recovery of the drone; whether there is one builder (D-001) or more; Japan as the place of building and first flights; and whether the budget (budget.total) counts the owner's time. Each answer is to be recorded as a decision."
    waits_for: owner
    affects:
      - D-001
      - D-005
      - D-006
      - budget.total
    opened: 2026-10-29
    raised_by: assistant
    phase: design
  - id: Q-028
    kind: question
    text: "Keep the repository name drone or change it. D-002 named it drone until the purpose was decided, and the purpose is now decided (D-008, D-009). AGENTS.md still says that Q-001 and Q-002 are open, which is out of date; its rewording follows this decision."
