  - id: Q-052
    kind: finding
    text: "Without a magnetometer the wind estimate never became valid before the glider crashed (wind error autonomy.minimal_wind_rms_ms); the standard and full suites flew the cycle with a wind error of about autonomy.flat_standard_wind_rms_ms and reached autonomy.flat_standard_ground_speed_ms against autonomy.flat_truth_ground_speed_ms with the true state. The minimal suite is not enough; whether a magnetometer becomes a requirement is for the owner once the sensor power is weighed against Q-012."
