  - id: Q-050
    kind: finding
    text: "Over a fully developed sea at autonomy.test_u10_ms every run crashed, even with the true state (after autonomy.waves_truth_crash_s at best), because the reference cycle from the optimizer keeps its lowest point at ds.clearance_min_m above the mean surface while crests rise above it; the cycle has to be planned and tracked in height above the local surface (altimeter, wave-following) or with a floor above the crests, as albatrosses fly within the troughs. Until then the form study's minimum winds hold for a flat sea only."
    waits_for: assistant
    affects:
      - R-02
      - R-12
    raised_by: assistant
    phase: design
    opened: 2026-10-29
    blocks: design_build
  - id: Q-051
    kind: finding
    text: "The tracker's feedback and clearance guard drove the load factor to autonomy.max_load_factor_waves, above ds.n_limit of R-09, and its guard floor (autonomy.guard_floor_m) sits below ds.clearance_min_m because the reference itself reaches the clearance; the controller needs a load-factor limit and a reference with margin above the guard."
