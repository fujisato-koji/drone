  - id: Q-054
    kind: finding
    text: "The cycle optimizer's wingtip constraint is conservative ((b/2)|mu| in place of (b/2) sin|mu| cos gamma), and the form study fixes the Charnock roughness at its 8 m/s value, which overstates every minimum wind by about 7% (K-007); also the literature convention z0 = 0.03 m gives about 1.9 times the Charnock shear (source sweep). Fix both, rerun the form study, and report the minimum winds for both roughness assumptions until Q-008 settles which one the sea follows. Done on 2026-10-29: tip_model geometric and the self-consistent z0 are in sim/dsopt.py, and the form study was rerun with Charnock and with z0 = 0.03 m (docs/02-form.md#form-comparison); K-009 confirmed both fixes and reproduced the rerun, and the defect it found between nodes moved to Q-059."
    waits_for: assistant
    affects:
      - dsopt.validation_u10_ms
      - form.baseline_2m.u10_min_travel_log
      - form.albatross_3m.u10_min_travel_log
      - R-02
    raised_by: checker
    phase: design
    opened: 2026-10-29
    closed: 2026-10-29
    closed_by: K-009
  - id: Q-055
    kind: question
    text: "Birds lighter than about 1.5 kg flap during the upwind climb and only the 9.6 kg wandering albatross gains energy by rolling alone (P84); the only funded competitor building a year-long soaring drone carries propellers (S2), and no real UAV has flown energy-positive soaring yet. Should R-02 (energy from the wind shear only) stay, or should the project stage it, with motor-assisted cycles first and wind-only cycles as the aim? Update 2026-10-30 (docs/02-form.md#ground-motor): with sourced propulsion values a calm day of motor flight costs about motor.baseline_calm_day_wh for the baseline and motor.albatross_calm_day_wh for the albatross-like glider, so motor assist can bridge hours, not calm days. Update 2026-10-31 (docs/02-form.md#wind-climate): in ERA5 from 2005 to 2024 the 90th percentile spell below ds.min_u10_ms costs the albatross-like glider climate.so_albatross_motor_p90_wh on the motor in the Southern Ocean and climate.home_albatross_motor_p90_wh in the home area, against climate.so_albatross_float_p90_wh and climate.home_albatross_float_p90_wh floating, so the motor bridges hours and the drone floats through the rest, as the birds do."
    waits_for: owner
    affects:
      - R-02
      - R-08
    raised_by: assistant
    phase: design
    opened: 2026-10-29
  - id: Q-056
    kind: finding
    text: "Height above the water in the low turn is the sensing problem: a hobby lidar lost about half its returns over water even in light wind and none came back when tilted (P85), and a 24 GHz radar altimeter that reads over water weighs about 110 g and draws about 2 W (M11), which collides with Q-012. Settle the altimeter by test over water, and carry its power into the power budget."
    waits_for: assistant
    affects:
      - R-12
      - R-08
    raised_by: assistant
    phase: design
    opened: 2026-10-29
  - id: Q-057
    kind: question
    text: "Replace flight on a precomputed flat-sea cycle by moment-to-moment decisions from the aircraft's own view of the sea, as the owner asked (2026-10-29): sense the surface (radar or lidar altimeter, optionally a forward scanner), estimate the local waves and predict the surface and the wave-coherent wind a few seconds ahead, and re-plan the next seconds of flight every half second in that prediction (receding horizon). Compare perfect wave knowledge, the flat-sea assumption and each sensor set, and report survival, energy, clearance, load factor, progress and the planner's computing time, so that the sensors can be weighed against Q-012 and Q-056. First results: docs/02-form.md#receding-horizon and Q-060."
    waits_for: assistant
    affects:
      - R-02
      - R-12
      - Q-050
      - Q-056
    raised_by: owner
    phase: design
    opened: 2026-10-29
  - id: Q-058
    kind: finding
    text: "The wave-coherent air motion of the model (linear potential flow relative to the wind, sim/seawind.py) disagrees with the measurement it should match (K-008): in calm air its vertical wind is about dsopt.wave_vertical_ratio_model of the water orbital speed against about dsopt.wave_vertical_ratio_measured measured over swell (P64), and at P64's own conditions it gives dsopt.wave_model_w_at_p64_ms where about 0.3 m/s was measured. Every result in which the waves alone carry the glider depends on this. Calibrate the vertical and horizontal wave wind against P64 and further measurements, or replace it by a wave-driven model for wind slower than the waves, and report the wave-only results with the calibrated model. Update 2026-10-29: the fit of P63 over 2.6 to 15 m has the model's own form, Aw |1 - U/c| a k c exp(-aw k z), with Aw of lit.wave_induced_amp_w and aw of lit.wave_induced_decay_w, so in calm air it gives about the orbital speed as the model does; P64's single case is lower. Use P63 as the calibration and P64 as the low bound (w_scale about 0.6)."
    waits_for: assistant
    affects:
      - R-02
      - R-12
      - dsopt.wave_floor_cases
    raised_by: checker
    phase: design
    opened: 2026-10-29
  - id: Q-059
    kind: finding
    text: "The cycle optimizer finds local optima and can cheat (K-008): the phase-slip integer m is fixed by the starting guess, so along-wave runs stay in dynamic-soaring minima near 10 m/s while the same waves carry the rotated across-wave cycle; the phase condition gamma(0) = 0 excludes a steady ride on the face; there are no limits on the rate of bank or lift coefficient, nor n >= 0, which let a 1.1 s cycle swing the controls fully. The flat mode also constrains the wingtip only at the nodes, so between nodes it dips to dsopt.flat_tip_mid_min_albatross_m against 0.3 m (K-009). K-011 added: solve() can accept a cycle whose dense replay does not close (one case at the u10 bound ended 17 m low), so a closure check on a dense replay should decide success; single runs move with the starting guess by up to 0.8 m/s for the albatross-like glider; n and V are held only at the nodes. Search several m values and rotations, set the phase condition on the wave phase, add rate limits and n >= 0, and rerun the wave study and the form study."
    waits_for: assistant
    affects:
      - dsopt.wave_floor_cases
      - dsopt.shelter_albatross_l20_on_ms
      - R-02
    raised_by: checker
    phase: design
    opened: 2026-10-29
  - id: Q-060
    kind: finding
    text: "The receding-horizon planner of Q-057 (sim/mpc.py) does not yet keep the drone in the air over waves (docs/02-form.md#receding-horizon): planning from scratch only glides; seeded with a library of optimizer cycles it flies a flat sea for mpc.flat_survival_min_s to mpc.flat_survival_max_s but still touches the water, because the cycles sit on the load-factor limit and the clearance edge; over waves it lasts mpc.wave_survival_min_s to mpc.wave_survival_max_s, a fitted sea is not consistently better than a flat one, and shifting the low point onto the forward face of the fitted wave made it worse in every pair tried. The few-component fit has no skill for the surface ahead in a wind sea (error mpc.fit_surface_error_min_m to mpc.fit_surface_error_max_m against a standard deviation of mpc.sea_std_u13_m). Give the library cycles margin (a higher minimum height and a load factor below the limit), add cycles synchronized with the waves once Q-058 and Q-059 are settled, model a scanner that sees a wider swath ahead, and find why the phasing hurts. Update 2026-10-29: with margins, the control limits of Q-062 and the load-factor limit, the planner flies a flat sea for mpc.margin_flat_truth_run_s on the true state and wind, but touches the water within mpc.margin_flat_est_survival_max_s on estimates and within mpc.margin_sea_survival_max_s over waves; what remains is the estimate on a flat sea and a planner that knows the waves (docs/02-form.md#energy-sources). K-011 added: the actuator delay is rounded to whole steps (0 at a step of 0.1 s), the planner's rollout does not apply the load-factor limit to its commands, the negative load factor is limited only by cl_min, and the flown wind should use the same roughness as the library. Update 2026-10-31 (docs/02-form.md#wave-loop): the planner now flies wave-synchronized cycles over long-crested swell with the sea known exactly (stage 1). Why the earlier runs ended: the flat world did not see the crests (the plans left the wingtip clear of their own surface and in the water against the true one), the truth world of 48 components hid them as well, the motor ran almost all the time so the waves were never the energy, and the runs that looped are the ones whose reflex had fired (Q-068). With a wave library (crest rides on the forward face and the optimizer's wave cycles), a guide locked to the wave phase and an entry at a phase match, wave.loop_full of wave.loop_runs runs over Hs 3 and 2 m at Tp 10 s flew the whole ten minutes and wave.loop_counted count; the power after the entry is wave.loop_ratio_min to wave.loop_ratio_max of the flat library's least nominal (open-loop) power, median wave.loop_ratio_median, a comparison that favours the flat sea (the planner paid mpc.burst_albatross_u6_normal_w over a flat sea at 6 m/s), and the lowest is wave.loop_power_min_w; in wave.loop_cases_motor_crest_only of the cases the library has only a motor crest ride. A crest ride is an equilibrium that holds only with the planner's feedback (K-020). What remains: the motor never stops (wave.loop_motor_share_min at best, against zero for the library's own cycles); at 3 m/s the entry chosen costs more than the flat sea, since the loop loses the forward face and the pilot chooses by nominal power; the steady powered leg is unsafe over a swell (wave.loop_flat_only_ended of the runs that fell back on it touched the water, Q-073); the sea from sensors is Q-064; irregular swell, a wind sea on top and the rest of the grid are not done. K-020 (partial) checked this pass; the code was fixed, the crest rides rebuilt, the experiments rerun and the document corrected. Update 2026-11-01 (docs/02-form.md#wave-loop, the pilot's choice and the forward face): the pilot now chooses by what the loop pays, a closed-loop trial of wave.pilot_trial_s from the run's start for every entry of the sea and the flat leg, in the planner's world, and flies the one of least cost with the margins first; crest rides carry a forward-face guide (an asymmetric phase tolerance, no climb while behind the ride, a bounded barrier near the crest); the flat leg is the powered leg above the mean sea level with the heading hold (Q-073). Over the same wave.pilot_runs cases all fly the whole time (wave.pilot_full, against wave.loop_full) and wave.pilot_counted count (against wave.loop_counted, wave.pilot_gained gained and wave.pilot_lost lost); at 3 m/s the highest power is wave.pilot_u3_power_max_w W against wave.loop_u3_power_max_w and the median wave.pilot_u3_power_median_w against wave.pilot_u3_earlier_power_median_w, the pilot having left the crest rides there for the optimizer's cycles; every run that ended on a wingtip before flies the whole time and counts (wave.pilot_tip_cases_counted of wave.pilot_tip_cases); the trials predict the runs within wave.pilot_trial_error_median_w W in the middle. What remains: the motor still runs (wave.pilot_motor_share_min at best); the trials cost one short flight per entry before each choice, which the simulation's clock does not count (Q-065), and their worth in stage 2 rests on the estimated sea (Q-064); the forward-face guide keeps some crest rides off the water (wave.pilot_face_ended of wave.pilot_face_trials trials ended on the water with it, wave.pilot_noface_ended without), but most of those still break a margin, it changes none of the choices, and it lowers the cost of most rides that hold both ways (K-022), and many crest rides still end on the water or break a margin in their trials at every wind; the trials predict the power of a run, not its margins over ten minutes (K-022); the margins-first rule is a choice of this pass that makes some runs dearer (wave.pilot_power_higher_runs); wave.pilot_stall_on_flat_leg_runs of the four runs that do not count dip below the stall speed on the flat leg (K-022); irregular swell, a wind sea on top and the rest of the grid are not done; K-022 (partial) checked this pass and the document was corrected."
    waits_for: assistant
    affects:
      - R-02
      - R-12
      - Q-057
    raised_by: assistant
    phase: design
    opened: 2026-10-29
  - id: Q-061
    kind: finding
    text: "The sea and wind model is neutral and keeps the log shear below the swell knee, while the measurements show two effects that add shear near the water (docs/02-form.md#sea-roughness): under swell with light wind the wind difference between 2.5 and 8 m was env.swell_shear_2p5_8_measured_min to env.swell_shear_2p5_8_measured_max of the wind at 8 m against env.swell_shear_2p5_8_log for the log profile (P65, P100), and stable air over a cold sea steepens the shear by about env.stability_factor_u8_cold_sea at 8 m/s and more in light wind (P95). Add a stability option (air-sea temperature difference with the stability functions of P95) and a swell profile whose shear below the knee follows the measurements, and rerun the form study in both, since these are the conditions in which a glider could reach R-02's design point. Update 2026-10-30: stability and the swell jet are now options of sim/seawind.py (docs/02-form.md#simulator-fitness), raising the shear of a cycle by about env.stability_l50_cycle_shear_factor in stable air; the cycle optimizer's own profile does not use them yet, which is what remains."
    waits_for: assistant
    affects:
      - R-02
      - env.swell_shear_2p5_8_measured_min
      - env.stability_factor_u8_cold_sea
    raised_by: assistant
    phase: design
    opened: 2026-10-29
  - id: Q-062
    kind: question
    text: "Settle the roll and pitch authority the flight models assume (docs/02-form.md#roll-authority): a non-dimensional roll rate p b/(2V) of ctrl.roll_pb2v, a lift-coefficient rate of ctrl.cl_rate_max_per_s, and an actuator lag of ctrl.actuator_tau_s with a delay of ctrl.actuator_delay_s. They rest on a flying-qualities floor for piloted aircraft (P106), one small glider's logs (P87), one small UAV's identification (P107) and the albatross video (P108). Settled when the aileron and wing design of the chosen form shows the roll rate with the roll-mode time constant from its inertia and damping (S3), and when a flight test of the first airframe measures both."
    waits_for: assistant
    affects:
      - ctrl.roll_pb2v
      - ctrl.cl_rate_max_per_s
      - R-02
    raised_by: assistant
    phase: design
    opened: 2026-10-29
  - id: Q-063
    kind: question
    text: "Should the drone ever make its low turn with a wingtip close to the water, as the albatross does? The model says the low point of the cycle is the largest lever on the wind needed (docs/02-form.md#energy-sources: the Sachs albatross model needs dsopt.sachs_coare_floor03_u10_ms with its wingtip held clear and the bound dsopt.sachs_coare_notip_floor01_u10_ms without the constraint), but R-12 keeps a clearance, and skimming needs the height of the wingtip above the moving water to a few centimetres about half a second ahead, a path accurate to tens of centimetres in gusts, and a wing that survives a touch. Study first, without changing R-12: the gain of ground effect near the water, a wingtip skid or float, dihedral or a gull wing that lifts the low tip, and low turns only in the troughs of long, predictable swell; then the owner decides whether R-12 changes. Update 2026-10-30: the owner decided the direction (D-018): the low turn may bring a wingtip close to the water, with a skid on each wingtip that sheds water and survives a touch and a sensor that detects water at the tip, and R-12 is to be revised once the study gives the clearance and the reaction it needs. The skim study (docs/02-form.md#wingtip-skim) answers how much the low tip gains in the wind needed, and with which wing geometry."
    waits_for: "assistant, then owner"
    affects:
      - R-12
      - R-02
    raised_by: assistant
    phase: design
    opened: 2026-10-30
  - id: Q-064
    kind: finding
    text: "The sea and wind model can compare soaring strategies but cannot yet verify a low turn within about a metre of the water (docs/02-form.md#simulator-fitness): the contact check uses a linear surface without sharp or breaking crests, the wave-coherent wind below 1 m is an extrapolation of P63 and the trough shelter is only the crude separation option, near-surface turbulence keeps a fixed length scale, stability and the swell profile are missing (Q-061), and no sensor measures the height under the low wingtip. Add crest geometry with second-order terms and breaking crests, the near-surface wave wind and trough shelter from published large-eddy simulations, height-scaled turbulence, and a wingtip height sensor model; then plan a low-turn flight test with RTK and a laser altimeter. Update 2026-10-30: second-order and breaking crests, the near-surface wave wind, height-scaled turbulence, stability and the swell jet are in sim/seawind.py, and wingtip sensors in sim/seasense.py; what remains is to fly the closed loop in that sea with those sensors, and the flight test. Update 2026-10-30 (D-018): the wingtip may now come close to the water with a skid; the forces of a touch, the tip sensor it needs and the time budget of the reaction are in docs/02-form.md#wingtip-skim, and a closed-loop check of a skimming low turn in the second-order sea is the next step. Update 2026-10-31 (docs/02-form.md#wave-loop, rerun after K-020): with the sea known exactly the closed loop over swell works, and the planner's sea was then given an error on purpose to say what sensing must deliver. The wave phase must be known to a few tenths of a radian, more tightly on the side that puts the planner's crests behind the true ones: at +0.3 rad (about 7 m along a 10 s swell) the flight still counts at wave.sense_phase_0p3_power_after_w against wave.sense_none_power_after_w, at +0.6 rad it sinks out of the band (wave.sense_phase_0p6_in_band) at wave.sense_phase_0p6_power_after_w, while -0.6 rad still counts (wave.sense_phase_m0p6_counted). The swell's height a tenth low and a fifth high both count (wave.sense_height_0p9_counted, wave.sense_height_1p2_counted); a fifth low makes the pilot fly the 2 m swell's entry, so a larger low estimate is untested. The present few-component fit is off by mpc.fit_surface_error_min_m to mpc.fit_surface_error_max_m in surface height, the whole amplitude of a 3 m swell, so stage 2 needs an estimator aimed at the dominant swell. Update 2026-11-01 (docs/02-form.md#sea-estimation, check K-021): stage 2 has a first answer. sim/swellest.py models the downward radars and lidar at the fuselage and the wingtips, an optional forward radar, the navigation height error of a filter on the IMU, GNSS with or without RTK and a barometer, and an extended Kalman filter of the dominant swell started by a grid search after a survey turn. Over the regular swell, RTK and the tip radars hold the phase from the survey through five minutes of crest ride (est.reg_radar_tips_rtk_t300_phase_p90_worst in the worst sea) and the height for two minutes (est.reg_radar_tips_rtk_t120_height_p90_worst), after which the height drifts, more over the 2 m swell (est.reg_radar_tips_rtk_t300_height_p90_worst); the forward radar (assumed) holds both in every sea (est.reg_radar_tips_fwd_rtk_t300_phase_p90_worst, est.reg_radar_tips_fwd_rtk_t300_height_p90_worst). In the closed loop of the sensing runs and its 2 m twin, every RTK set counts (for example est.loop_tips_rtk_hs3_counted, est.loop_tips_rtk_hs2_counted) at est.loop_radar_tips_rtk_hs3_power_after_w and est.loop_radar_tips_rtk_hs2_power_after_w after the entry against the oracle's wave.loop_albatross_hs3_along_u6_p63_power_after_w and wave.loop_albatross_hs2_along_u6_p63_power_after_w. Not met: without corrections and without the forward radar the estimate loses the phase in a ride (est.reg_radar_tips_t300_phase_p90_mid) and the closed loop fails (est.loop_radar_tips_hs3_counted, est.loop_radar_tips_hs2_aloft_s). K-021 found that over the regular swell this loss comes from the extended Kalman filter's forgetting more than from the sensors: its own phase sigma stays small while its error passes 1 rad, and a fit that holds a regular swell's amplitude constant keeps the standalone phase at 0.17 to 0.50 rad, so a consistent estimator is a remaining item and the verdict on GNSS without corrections waits on it and on the assumed velocity error (Q-074). The forward radar removes the need for RTK over the regular swell (est.reg_radar_tips_fwd_baro_t300_phase_p90_worst, est.loop_radar_tips_fwd_baro_hs3_counted), but every value of it is assumed (Q-074). Also not met: the barometer reads the swell's own air pressure as height (est.reg_radar_tips_baro_t60_height_p90_mid); without the survey the estimate goes wrong unless the forward radar sees the wave (est.orc_hs3_radar_tips_rtk_t60_phase_p90). What remains: a consistent estimator whose sigmas follow its error; a height reference that holds over the swell's time scales without a base station (RTK needs one within sense.rtk_baseline_max_km; PPP-RTK only where its service reaches), or a real forward-looking sensor; the irregular swell in a long ride, where every set loses the phase (est.irr_irregular_hs3_along_radar_tips_rtk_t300_phase_p90, est.irr_irregular_hs3_along_radar_tips_fwd_rtk_t300_phase_p90); a wind sea on top; the sea history's short-crested swell, which no set finds (est.irr_mixed_along_radar_tips_rtk_t60_phase_p90); a readiness test that sees a lost phase; the survey as a flight mode of the pilot; the tip sensor's reach (Q-075); and the flight test."
    waits_for: assistant
    affects:
      - R-12
      - R-02
      - Q-063
    raised_by: assistant
    phase: design
    opened: 2026-10-30
  - id: Q-065
    kind: question
    text: "Can the receding-horizon planner run on board in real time? In the simulation the clock stops while it plans; on a PC in Python one replan took 0.15 s on average with a flat-sea world, 0.45 to 0.52 s with a fitted wave world and 2.4 s (7.5 s at most) with the true sea of 48 components (sim/out/mpc.json), against a replan interval of 0.5 s. Settled by a planner implementation sized for an on-board computer (compiled code, fewer samples, the cycle library as the seed), its measured time per replan, and the mass and power of that computer in the power budget (Q-012). Update 2026-10-30: the same planner ported to JavaScript plans in about mpc.js_plan_flat_ms (flat world) and mpc.js_plan_truth_ms (true sea of 48 components) in node (docs/02-form.md#viewer), which suggests compiled code on a small computer can meet the interval; the on-board time is still to be measured."
    waits_for: assistant
    affects:
      - Q-057
      - Q-012
      - R-08
    raised_by: owner
    phase: design
    opened: 2026-10-30
  - id: Q-066
    kind: question
    text: "How does the drone choose its course towards a target that lies upwind or downwind? The receding-horizon planner only flies a cycle at a course it is given (Q-057), and a dynamic-soaring glider, like a yacht, cannot sail straight into the wind; albatrosses choose headings about lit.albatross_preferred_heading_deg off the wind and route like yacht racers (P73) and can travel upwind (P43). Build the autonomy in three layers: a strategic layer that routes over forecast wind and waves and decides when to rest on the water or use the motor; a tactical layer that chooses which cycles or powered legs to fly from the aircraft's velocity hull (the achievable mean ground velocities) for the best speed made good towards the target, and when to tack or gybe; and the planner that flies it. Settled when a closed-loop flight reaches a target 10 km upwind in the simulation (D-009). Status 2026-10-31 (docs/02-form.md#navigation): the condition is met on a flat sea with the true state and wind, for the albatross-like glider with the motor at 13 and 16 m/s, on the velocity hull with steady powered legs; open: waves, the state and wind from the estimator, other angles to the wind, a wind that changes during the flight (a soaring flight that must turn into a powered leg), the other forms at 10 km, and a mix of soaring and powered legs. Update 2026-10-31 (docs/02-form.md#wave-loop, rerun after K-020): over a 3 m swell of 10 s along a 6 m/s wind, with the hull built from the wave library, the drone soars to a target 5 km along the swell's travel in wave.nav_arrival_s_with s at wave.nav_vmg_ms_with m/s for wave.nav_energy_wh_with Wh on two crest rides, and the run counts (wave.nav_counted_with). Across the swell's travel the hull has no soaring way: every soaring point travels with the swell, so the navigator falls back on a steady powered leg, and that leg is not flyable over a 3 m swell (the aircraft flew wave.nav_heading_off_min_deg_across to wave.nav_heading_off_max_deg_across deg off the commanded course, crossed the target's line wave.nav_crossing_offset_m_across m east of it and ended farther from it than it started); a powered leg over waves needs its own reference (Q-073). Update 2026-11-01 (docs/02-form.md#wave-loop, the powered leg over swell): with the heading hold in the planner's nominal and the leg above the mean sea level, the steady leg arrives and counts across the swell's travel in wave.leg_across_msl_hold_arrival_s s for wave.leg_across_msl_hold_energy_wh Wh and upwind against it in wave.leg_against_msl_hold_arrival_s s for wave.leg_against_msl_hold_energy_wh Wh (Q-073); the heading fields above compare the heading through the air with the bearing over the ground and carry the crab angle, while the ground track of the run across was wave.leg_across_surface_track_off_min_deg to wave.leg_across_surface_track_off_max_deg deg off the commanded bearing."
    waits_for: assistant
    affects:
      - R-02
      - Q-057
    raised_by: owner
    phase: design
    opened: 2026-10-30
  - id: Q-067
    kind: finding
    text: "The wing-sizing study (docs/02-form.md#wing-sizing) fixed the mass by the wing's size, so the lighter slender wings ranked lower, while at equal mass they soar from less wind (K-014); and each design was solved from one start. The second pass (sim/out/wingopt2.json) made the wing loading a variable (ballast up to ds.mass_max_kg), solved each soaring minimum from six starts, built the body drag up from pod, boom, tails and linkages, applied the taper offset of Nita and Scholz, and added the motor power. Settled: ballast up to the mass limit gives the lowest soaring minimum (wing.best_u10_min_ms, against wing.unballasted_u10_min_ms to wing.unballasted_u10_max_ms without it), so the mass limit binds, and the price is motor power at 9 m/s (the front in docs/02-form.md#wing-sizing, K-016); the three best designs differ by less than the tail sizing moves the minima (wing.top3_spread_ms against wing.tail_quarter_gain_min_ms), so their order is not reliable; h(180) is the best speed made good straight upwind and is negative, while h(chi) times a cosine at other courses is not a speed made good (docs/02-form.md#navigation). Left: the 2.5 m rows, intermediate ballast between the grid points and the limit, the tail sizing (arm, aspect ratios; the horizontal tail's Reynolds number is below the data of the airfoil fit), whether a motor cycle that mixes soaring and thrust beats level flight at the speed floor (the optimizer stays at level flight; K-016), h(180) for more than the top four, and the stiffness of the spar: the mass model sizes its caps for stress only with the pultruded tube's modulus (spar.carbon_modulus, P54), and stress-sized caps then miss the deflection limit of D-014 for every design (heavy.ar16_stiff_caps_factor to heavy.ar20_stiff_caps_factor times the cap mass, which at a fixed total mass comes out of the ballast; unidirectional caps at spar.ud_carbon_modulus need only heavy.ar16_stiff_caps_factor_ud to heavy.ar20_stiff_caps_factor_ud, Q-010), and among the structural model's own tube sizes (diameters in whole millimetres, walls up to 2 mm) none fits an aspect ratio 20 design, while a free search fits one at 3 and 4 kg at several times the cap mass (K-018), so the wing study must add the stiffness constraint (docs/02-form.md#wing-sizing, heavier than the limit)."
    waits_for: assistant
    affects:
      - R-02
      - ds.mass_max_kg
      - Q-024
    raised_by: checker
    phase: design
    opened: 2026-10-30
  - id: Q-068
    kind: finding
    text: "The reflex layer of the planner (docs/02-form.md#receding-horizon) fires falsely on its stall test at the end of its prediction and, over waves, made flights end sooner (K-015). Redesign it: a stall threshold below the planner's own speed floor (0.95 stall speeds removed the false firings and kept four constructed rescues), a stall test that accounts for the load factor, an override that scales thrust and lift with the attitude instead of full thrust, a fixed lift coefficient and wings level (which zooms the aircraft and fails past the vertical), and a prediction in a world that sees the waves; also check that steady library cycles fly along their course. Update 2026-10-30 (D-018): the redesign also takes the wingtip skid and the tip sensor; the time budget from a wet or range signal at the tip to a roll-out that keeps the skid's immersion within its depth, and the numbers it sets for the sensor, are in docs/02-form.md#wingtip-skim. Update 2026-11-01 (docs/02-form.md#receding-horizon, the redesigned reflex): sim.mpc.Reflex2 predicts in the planner's world (over swell the waves the planner sees) and acts on a predicted violation only within ctrl.reflex2_lead_s; its stall test, corrected after K-022, fires below the planner's own speed floor (ctrl.reflex2_v_floor_frac stall speeds) when the plan holds the wing at ctrl.reflex2_cl_frac of cl_max or more, not cut by the load-factor limit, while the flight path still falls, or below half the stall speed (without the floor it fired on the wave cycles, which ride cl_max in their turns) (the first version tested the airspeed at the load factor of wings-level flight, ctrl.reflex2_v_frac at cos gamma, and left out the bank and the curvature of the path); the range reading at the low wingtip (truth plus skid.req_range_accuracy_m, skid.req_range_rate_hz, skid.req_range_latency_s and skid.sense_process_s late) is the primary tip trigger against a trigger gap that grows with the closing rate (the skim study's time budget over the bank and the airspeed), armed only while the water stands above the planner's sea (D-020), with the wet sensor as the last resort (D-019); the override is wings level, the full allowed pull while descending and a flight-path law once climbing, with the thrust falling to zero at ctrl.reflex2_thrust_zero_deg of climb. On constructed stale plans it rescues as many dives as the first reflex (reflex.dive_truth_v2_rescues of reflex.dive_truth_none_base_contacts) without a loop, every contact the prediction sees without the loops of the first (reflex.contact_truth_v1_loops), and every contact the prediction does not see (reflex.contact_flat_v2_rescues against reflex.contact_flat_v1_rescues for the first), reflex.contact_flat_v2_rescues_with_range of them with a range firing and the rest on the prediction's tests in its flat world, the corrected stall test among them, with the tip never wet; on the flat-sea navigation runs it never fired (reflex.nav5_firings, reflex.nav10_firings) and the runs are unchanged; over swell it fired reflex.loop_firings times in reflex.loop_runs runs and changed no outcome (reflex.loop_worse worse, reflex.loop_rescues rescued; the first stall test fired once, on a dip below the stall speed high above the water on the flat leg, which the corrected test leaves to the planner). The calm library entries fly along their course (sim.mpc.calm_course_errors is empty since align_calm_entries); the wind entries' mean tracks lie off their course by construction, which the velocity hull uses. What remains: a rescue from a slow banked turn dips to reflex.contact_flat_v2_v_min_over_stall of the stall speed; the forces of the skid are not in the point mass, so a touch within its depth is counted, not flown; the lead, the hold times, the flight-path law and the thrust schedule are assumed and were chosen on these cases; the range trigger is untested against a sea estimated from the sensors (Q-064), the case it is for; the planned skim at a clearance of zero would fire the wet sensor (Q-063); K-022 (partial) checked this pass and the document was corrected."
    waits_for: assistant
    affects:
      - Q-060
      - Q-055
    raised_by: checker
    phase: design
    opened: 2026-10-30
  - id: Q-069
    kind: question
    text: "Should the drone carry variable ballast, water taken from the sea and dumped to it, so that it soars heavy in strong wind (the soaring minimum falls with the wing loading up to ds.mass_max_kg, Q-067) and flies light on the motor in weak wind (the motor power rises with the mass)? It costs a pump, a tank and a dump valve, and a way to take water on at sea, and it works against a sealed hull. Update 2026-10-31 (docs/02-form.md#wind-climate): the wind is below ds.min_u10_ms for climate.so_year_below_dsmin_share of the hours in the Southern Ocean and climate.home_year_below_dsmin_share in the home area, and below wing.best_u10_min_ms for climate.so_year_below_best_share and climate.home_year_below_best_share, which is how the time would split between heavy and light flight."
    waits_for: owner
    affects:
      - Q-067
      - ds.mass_max_kg
    raised_by: assistant
    phase: design
    opened: 2026-10-30
  - id: Q-070
    kind: question
    text: "The wingtip skid and the tip sensor of D-018 rest on sizes and coefficients that no source gives (skid.blade_thickness_m, skid.blade_rake_deg, skid.blade_depth_m, skid.ski_beam_m, skid.ski_length_m, skid.ski_trim_deg, skid.float_beam_m, skid.float_length_m, skid.blade_mass_kg, skid.ski_mass_kg, skid.float_mass_kg, skid.misalignment_deg, skid.sense_process_s) and on a rudder lift coefficient (skid.rudder_cl_max), and the water forces are extrapolated far beyond the Froude numbers of the sources (docs/02-form.md#wingtip-skim). Settle them by towing candidate skids in sea water at 10 to 25 m/s with 0.5 to 3 cm of immersion (drag, side force, ventilation, and the wet and range signals of the tip sensor), and by sizing the tail for the yaw authority."
    waits_for: assistant
    affects:
      - R-12
      - Q-063
      - Q-068
    raised_by: assistant
    phase: design
    opened: 2026-10-30
  - id: Q-071
    kind: question
    text: "The skim study (docs/02-form.md#wingtip-skim) makes a range reading at the tip the primary trigger of the reflex and the wet sensor the last resort, and requires the skid blade to trail in the water flow (a castering blade that accepts the spread of the crab angle along the skim arc, K-018); both go beyond the wording of D-018, which names a sensor that detects water at the tip and a skid that sheds water and survives a touch. Decide whether to adopt them as the direction for the tip sensor and the skid."
    waits_for: owner
    affects:
      - R-12
      - Q-063
      - Q-068
      - Q-070
    raised_by: assistant
    phase: design
    opened: 2026-10-31
    closed: 2026-10-31
    closed_by: D-019
  - id: Q-072
    kind: finding
    text: "The home operating area (private:loc-01) is a weak-wind sea beside the albatross regions (docs/02-form.md#wind-climate): its year mean 10 m wind is climate.home_year_u10_mean_ms against climate.so_year_u10_mean_ms in the Southern Ocean and climate.np_year_u10_mean_ms in the North Pacific, the wind is below ds.min_u10_ms for climate.home_year_below_dsmin_share of the hours and below wing.best_u10_min_ms for climate.home_year_below_best_share, and in the hours below ds.min_u10_ms swell of 3 m or more is present only climate.home_weak_dsmin_swell3_share of the time. A year aloft there would be spent mostly on the water or on the motor; floating through its 99th percentile spell below wing.best_u10_min_ms takes climate.home_best_float_p99_wh. Decide what the home area is for (tests of floating, take-off and motor legs, or the year-long flight) and where the year-long flight is meant to happen. The owner deferred this decision on 2026-10-31 until the aircraft's performance is established."
    waits_for: owner
    affects:
      - R-02
      - R-08
      - Q-048
    raised_by: assistant
    phase: design
    opened: 2026-10-31
  - id: Q-073
    kind: finding
    text: "The steady powered leg of the navigation layer (sim.navigator.SteadyModel, flown as a steady reference by sim/mpc.py) is not flyable over swell (docs/02-form.md#wave-loop, K-020). It holds a constant height above the local surface, so its reference rides up and down with the swell. In the navigation run across a 3 m swell of 10 s along a 6 m/s wind the aircraft flew wave.nav_heading_off_min_deg_across to wave.nav_heading_off_max_deg_across deg off the commanded course, crossed the target's line wave.nav_crossing_offset_m_across m east of it, was below the stall speed for wave.nav_below_stall_s_across s and brought a wingtip down to wave.nav_wingtip_min_m_across m; wave.loop_flat_only_ended of the closed-loop runs that fell back on it touched the water. Give a powered leg over waves its own reference (a constant height above the mean surface, or a wave-synchronized powered cycle) and fly it in the closed loop over swell across and against the swell's travel. Update 2026-11-01 (docs/02-form.md#wave-loop, the powered leg over swell): the course was lost because each guided plan restarts from the steady reference's wings-level nominal with one weighted update, so its small corrections are discarded (the near-uniform weights from the constant-bank candidates add to it but are not the cause, K-022), not because of the height reference, the cross-track guidance or the wave wind's mean; the heading fields of the run compare the heading through the air with the bearing over the ground and carry the crab angle, and the ground track was wave.leg_across_surface_track_off_min_deg to wave.leg_across_surface_track_off_max_deg deg off. The fix is a heading hold in the planner's nominal of a steady reference (nav.steady_heading_tau_s), and the leg chosen holds 10 m above the highest crest relative to the mean sea level: across the swell's travel it arrives and counts in wave.leg_across_msl_hold_arrival_s s at wave.leg_across_msl_hold_vmg_ms m/s for wave.leg_across_msl_hold_energy_wh Wh with the wingtip at least wave.leg_across_msl_hold_wingtip_min_m m up, and upwind against the swell's travel in wave.leg_against_msl_hold_arrival_s s at wave.leg_against_msl_hold_vmg_ms m/s for wave.leg_against_msl_hold_energy_wh Wh with the wingtip at least wave.leg_against_msl_hold_wingtip_min_m m up, never below the stall speed; the leg above the local surface with the hold also counts at about the same energy with less height under the wingtip, and the leg without the hold ended on the water against the swell. The closed-loop runs over swell now start on this leg and fall back on it, and none of those runs ended (wave.pilot_flat_choice_ended). What remains: one sea and one aircraft; flown along the swell's travel the leg does not hold its reference height (wave.leg_msl_along_height_min_m to wave.leg_msl_along_height_max_m m against wave.leg_msl_ref_height_m m) and broke the stall margin in wave.pilot_stall_on_flat_leg_runs of the four runs that do not count, two of them on the start leg (K-022); the crest height comes from the oracle sea and must come from the sensors (Q-064). The fix to try next: a height hold in the planner's nominal for steady references, as the heading hold, or carrying the previous plan as the nominal; the checker's carried-nominal variant held the course within wave.leg_diag_carried_nominal_track_off_deg deg without the heading hold but broke the stall margin for wave.leg_diag_carried_nominal_below_stall_s s (K-022). K-022 (partial) checked this pass and the document was corrected."
    waits_for: assistant
    affects:
      - Q-066
      - Q-060
      - R-12
    raised_by: checker
    phase: design
    opened: 2026-10-31
  - id: Q-074
    kind: question
    text: "The sea estimation (docs/02-form.md#sea-estimation) rests on sensor values that no source in the record gives, each assumed: the rates and latencies of the laser and radar altimeters and the tip radars (sense.lidar_rate_hz, sense.lidar_latency_s, sense.radar_latency_s, sense.tip_radar_rate_hz, sense.tip_radar_latency_s), the tip radar's mass and its noise over the sea (sense.tip_radar_mass_g, sense.tip_radar_noise_m: P136's 1.4 cm is the mean standard deviation over 5 m stretches of a 77 GHz radar with a beam of about 28 by 14 deg over a small stream, with an rms error of 3.1 cm and a bias of 1.9 cm, not a per-sample noise of the A121 over the sea; and the reach of the A121 with a lens, M16, is paired in the model with the bare chip's beam, which no source gives), the whole forward radar (sense.fwd_rate_hz, sense.fwd_noise_m, sense.fwd_latency_s, sense.fwd_dropout, sense.fwd_mass_g, sense.fwd_power_w), the vertical error of GNSS without corrections and its time scales (sense.gnss_vert_sigma_m, sense.gnss_bias_tau_s, sense.gnss_height_white_m, sense.gnss_horiz_white_m, sense.gnss_vz_sigma_ms, sense.gnss_vel_tau_s, sense.gnss_vel_tau_white_s, sense.gnss_rate_hz, sense.gnss_mass_g), the RTK error and its correction link (sense.rtk_vert_sigma_m, sense.rtk_vert_white_m, sense.rtk_bias_tau_s, sense.rtk_horiz_sigma_m, sense.rtk_horiz_white_m, sense.rtk_link_mass_g, sense.rtk_link_power_w), the vertical accelerometer error in flight with the attitude's share (sense.imu_vbias_sigma_ms2, sense.imu_vbias_tau_s, sense.imu_mass_g), the barometer's rate in its high precision mode, its drift and its static-source error in steady flight (sense.baro_rate_hz, sense.baro_drift_tau_s, sense.baro_static_sigma_m, sense.baro_static_tau_s, sense.baro_mass_g, sense.baro_power_w) and the bank error of the attitude estimate (sense.att_sigma_deg, sense.att_tau_s). What would settle them: the full datasheets of the parts chosen, and a flight log of the GNSS receiver, the IMU and the barometer over water (the velocity error's spectrum decides whether GNSS without corrections can hold the swell's phase), with the tip and nadir radars logging over a known surface."
    waits_for: assistant
    affects:
      - Q-064
      - Q-012
    raised_by: assistant
    phase: design
    opened: 2026-10-31
  - id: Q-075
    kind: question
    text: "Should the tip sensor of D-019 also serve the swell estimate (docs/02-form.md#sea-estimation)? Current: D-019 and the skim study ask the tip sensor to read the gap to the water over skid.req_range_span_m, for the skim only. Proposed: the same sensors also read the water from the heights of the crest rides and the climbs above them, as the estimate models them (as the estimate models them: the reach of the A121 with a lens, sense.tip_radar_rmax_m, with the bare chip's wide beam and another radar's noise over a stream, sense.tip_radar_noise_m; no source yet gives that combination over the sea, and a ride without corrections climbed beyond that reach), so that the difference between the tips gives the sea's slope in a ride. Recommendation: adopt it. Over the regular swell with RTK the tip radars alone (tips_rtk) do about as well as with the radar altimeter at the fuselage, for est.set_tips_rtk_power_w against est.set_radar_tips_rtk_power_w, and the laser altimeter alone, which has no slope to read, loses the phase in a ride. It touches R-12 and the tip sensor's choice (Q-070, Q-074); it does not relax any requirement."
    waits_for: owner
    affects:
      - Q-064
      - Q-070
      - R-12
    raised_by: assistant
    phase: design
    opened: 2026-10-31
  - id: Q-076
    kind: finding
    text: "The MPPI update of the planner (sim.mpc.MPPIPlanner.update) scales its temperature by the standard deviation of the live rollouts' costs, and every plan includes constant-bank candidates (MPPIPlanner._candidates) whose costs, under a tight tolerance of the guide (the heading of a steady reference, 0.04 rad), lie far above the rest; they inflate that spread, so the weights become nearly uniform and the update stays near the guide's nominal (docs/02-form.md#wave-loop, the powered leg over swell, pilot flights not recorded). Over a flat sea this goes unseen, since the nominal is right; over swell it lost the course of the steady leg (Q-073), which the heading hold in the nominal now works around. The same may weaken the planner wherever a tolerance is tight (the wave phase of a crest ride, 0.1 rad). Decide whether to make the temperature robust to such samples (a spread of the better half, or the gap from the best to the median: tried once, it helped the heading but less than the hold), to keep the candidates out of the spread, or to leave it. K-022: neither a temperature without the constant-bank candidates nor a planner without them holds the course without the hold, while a nominal carried over from the previous plan does; the question is the reset of a guided plan's nominal at every replan (mpc.py, MPPIPlanner.plan with a guide), which the heading hold works around for the heading and nothing yet for the height (Q-073)."
    waits_for: assistant
    affects:
      - Q-060
      - Q-073
    raised_by: assistant
    phase: design
    opened: 2026-11-01
  - id: Q-077
    kind: question
    text: "The redesigned reflex (docs/02-form.md#receding-horizon, sim.mpc.Reflex2) arms the range trigger at the wingtip, which D-019 makes the primary trigger, only while the water stands higher than the planner's sea at the same point and time by more than three times the sensor's accuracy, so that a tip that comes down to the water as the plan intends does not fire it; a plan that puts the tip into the water is left to the prediction's test. This goes beyond the wording of D-019. Decide whether to adopt it; with the trigger always armed, every planned approach of the tip within its trigger gap would fire the reflex (the gap grows with the closing rate and passes the sensor's span at a fast closing)."
    waits_for: owner
    affects:
      - Q-068
      - Q-063
      - R-12
    raised_by: assistant
    phase: design
    opened: 2026-11-01
