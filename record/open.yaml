  - id: Q-016
    kind: question
    text: "The medical check at the renewal of the remote pilot certificate is assumed to cost the same as the medical check by documents at the first issue (cost.license_medical_documents). The totals of docs/05-parts-and-cost.md#totals use that assumption. It is settled by a source for the price of the renewal medical check."
