  - id: Q-015
    kind: question
    text: "The inputs of the structural and mass model that no source gives are assumed: spar.fit_fraction, spar.joiner_factor, skin.thickness_mm, skin.density, core.density, film.mass_kg, and the component masses battery.mass_kg, avionics.mass_kg, camera.mass_kg, pod.mass_kg, boom.mass_kg and tail.mass_kg (sim/structure.py). They are settled by the parts list and its weights in step 1.5 once a form is chosen, and the skin and core values by a datasheet of the material bought."
