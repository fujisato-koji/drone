  - id: Q-053
    kind: finding
    text: "The spar sizing checks the fit inside the airfoil only at the root while the tube runs the whole span (K-007); a constant tube of spar.od_mm fits only the inner part of the half span. The spar has to taper or step, and the sizing has to check fit and strength along the span; the limiting-criterion label also has to be fixed."
    waits_for: assistant
