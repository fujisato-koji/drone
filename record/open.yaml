    text: "The wing geometry and design mass of the baseline (wing.span_m, wing.root_chord_m, wing.taper, wing.thickness_ratio, wing.design_mass_kg) and the parameters of the candidate forms (form.<candidate>.span_m, mass_kg, wing_area_m2, cd0, oswald, cl_max, taken from the aircraft registry in sim/aircraft_models.py) are assumed. They are settled by the form study: the comparison in docs/02-form.md#form-comparison and the owner's choice of a form (docs/02-form.md#candidate-forms), after which the chosen form's geometry is written as the wing keys and the others are dropped. The span and mass of the baseline candidate are wing.span_m and wing.design_mass_kg. Update 2026-10-30: the polar and the mass now come from measured airfoil data and sailplane data in the wing-sizing study (docs/02-form.md#wing-sizing); the candidates' assumed polars were too clean."
